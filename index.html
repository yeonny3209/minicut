/* ═══ 패널 배선 ═══ */
const liveSync = [];   // 캔버스 드래그처럼 패널 밖에서 값이 바뀔 때 슬라이더를 따라가게 한다
function bindSliderIn(root, id, unit, apply){
  const r = root.querySelector('#' + id);
  const n = root.querySelector('#' + id + '-n');
  const o = root.querySelector(`[data-out="${id}"]`);
  if (!r) return;
  const commit = v => {
    v = clamp(Number(v), Number(r.min), Number(r.max));
    if (!isFinite(v)) return;
    r.value = v; n.value = v;
    if (o) o.textContent = v + (unit || '');
    apply(v);
  };
  let dirty = false;
  r.addEventListener('input',  e => { dirty = true; commit(e.target.value); });
  r.addEventListener('change', () => { if (dirty){ pushHistory(); dirty = false; } });
  n.addEventListener('input',  e => commit(e.target.value));
  n.addEventListener('change', () => pushHistory());
  const lab = r.closest('.row').querySelector('label');
  if (lab) lab.addEventListener('dblclick', () => { commit(r.dataset.def); pushHistory(); });
}
function bindSlider(id, unit, apply, read){
  bindSliderIn(inspector, id, unit, apply);
  if (read && inspector.querySelector('#' + id)) liveSync.push({ id, unit, read });
}
function syncLiveValues(){
  for (const s of liveSync){
    const r = $i(s.id), n = $i(s.id + '-n'), o = inspector.querySelector(`[data-out="${s.id}"]`);
    if (!r) continue;
    const v = Math.round(s.read() * 1000) / 1000;
    if (document.activeElement !== r) r.value = v;
    if (n && document.activeElement !== n) n.value = v;
    if (o) o.textContent = v + (s.unit || '');
  }
}
function bindSeg(sel, cb){
  const wrap = inspector.querySelector(sel);
  if (!wrap) return;
  wrap.querySelectorAll('button').forEach(b => { b.onclick = () => cb(b.dataset.v); });
}
function bindColor(id, apply){
  const el = $i(id);
  if (!el) return;
  el.addEventListener('input', e => apply(e.target.value));
  el.addEventListener('change', () => pushHistory());
}
function bindCheck(id, apply){
  const el = $i(id);
  if (!el) return;
  el.addEventListener('change', e => { apply(e.target.checked); pushHistory(); });
}
// 자막·효과·스티커·음악은 모두 [start, end] 구간이라 시간 입력 처리를 공유한다.
function bindRange(it, capToTotal){
  const sEl = $i('rg-start'), eEl = $i('rg-end');
  if (!sEl || !eEl) return;
  sEl.addEventListener('change', () => {
    it.start = clamp(Number(sEl.value) || 0, 0, Math.max(it.end - 0.1, 0));
    sortRanges(); pushHistory(); refreshAll();
  });
  eEl.addEventListener('change', () => {
    let v = Math.max(Number(eEl.value) || 0, it.start + 0.1);
    if (capToTotal) v = Math.min(v, Math.max(totalDur(), it.start + 0.1));
    it.end = v;
    sortRanges(); pushHistory(); refreshAll();
  });
}

/* ═══ 프리뷰 화면 위 드래그 ═══
   좌표는 캔버스 픽셀이 아니라 0~1 비율로 저장하므로 프리뷰와 내보내기에서 같은 자리에 찍힌다.
   자막·스티커를 잡으면 그것이, 클립이 선택된 상태에서 빈 곳을 끌면 영상 자체가 움직인다. */
let canvasDrag = null, suppressClick = false;
const canvasNorm = e => {
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width, y:(e.clientY - r.top) / r.height };
};
const hitAt = p => {
  for (let i = hitRects.length - 1; i >= 0; i--){   // 위에 그려진 것이 우선
    const r = hitRects[i];
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) return r;
  }
  return null;
};
canvas.addEventListener('pointerdown', e => {
  if (exporting || e.button > 0) return;
  const p = canvasNorm(e);
  const hit = hitAt(p);
  if (hit){
    const it = KINDS[hit.kind].find(hit.id);
    if (!it) return;
    if (!(selection.type === hit.kind && selection.id === hit.id)) select(hit.kind, hit.id);
    suppressClick = true;
    canvasDrag = { kind:hit.kind, it, p0:p, c0:{ x:e.clientX, y:e.clientY },
                   cx:hit.x + hit.w/2, cy:hit.y + hit.h/2, hw:hit.w/2, hh:hit.h/2, moved:false };
  } else if (selection.type === 'clip'){
    const c = findClip(selection.id);
    if (!c) return;
    canvasDrag = { kind:'clip', it:c, p0:p, c0:{ x:e.clientX, y:e.clientY },
                   x0:c.tf.x, y0:c.tf.y, moved:false };
  } else return;
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  const p = canvasNorm(e);
  if (!canvasDrag){
    canvas.style.cursor = exporting ? '' : (hitAt(p) ? 'move' : (selection.type === 'clip' ? 'grab' : ''));
    return;
  }
  if (!canvasDrag.moved && Math.hypot(e.clientX - canvasDrag.c0.x, e.clientY - canvasDrag.c0.y) < 4) return;
  canvasDrag.moved = true; suppressClick = true;
  canvas.style.cursor = 'grabbing';
  const dx = p.x - canvasDrag.p0.x, dy = p.y - canvasDrag.p0.y;

  if (canvasDrag.kind === 'clip'){
    canvasDrag.it.tf.x = clamp(canvasDrag.x0 + dx, -1.5, 1.5);
    canvasDrag.it.tf.y = clamp(canvasDrag.y0 + dy, -1.5, 1.5);
    subGuide = null;
    return;
  }
  // 블록이 화면 밖으로 나가지 않게 중심을 (반폭 ~ 1-반폭) 안에 가둔다.
  let x = clamp(canvasDrag.cx + dx, Math.min(canvasDrag.hw, 0.5), Math.max(1 - canvasDrag.hw, 0.5));
  let y = clamp(canvasDrag.cy + dy, Math.min(canvasDrag.hh, 0.5), Math.max(1 - canvasDrag.hh, 0.5));
  const g = { x:false, y:false };
  if (Math.abs(x - 0.5) < 0.015){ x = 0.5; g.x = true; }
  if (Math.abs(y - 0.5) < 0.015){ y = 0.5; g.y = true; }
  subGuide = g;
  if (canvasDrag.kind === 'subtitle'){ canvasDrag.it.style.x = x; canvasDrag.it.style.y = y; }
  else { canvasDrag.it.x = x; canvasDrag.it.y = y; }
});
const endCanvasDrag = () => {
  if (!canvasDrag) return;
  const moved = canvasDrag.moved;
  canvasDrag = null; subGuide = null;
  canvas.style.cursor = '';
  if (moved){ pushHistory(); renderInspector(true); }
};
canvas.addEventListener('pointerup', endCanvasDrag);
canvas.addEventListener('pointercancel', endCanvasDrag);
canvas.addEventListener('click', () => {
  if (suppressClick){ suppressClick = false; return; }
  togglePlay();
});

['dragenter','dragover'].forEach(t => {
  document.addEventListener(t, e => {
    if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
    e.preventDefault();
    dropzone.classList.add('hot');
    dropzone.style.display = 'flex';
  });
});
document.addEventListener('dragleave', e => {
  if (e.relatedTarget) return;
  dropzone.classList.remove('hot');
  updateEmptyState();
});
document.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  dropzone.classList.remove('hot');
  updateEmptyState();
  addFiles(e.dataTransfer.files);
});
function updateEmptyState(){
  dropzone.style.display = project.clips.length ? 'none' : 'flex';
}

/* ═══ 프로젝트 파일 ═══ */
function saveProject(){
  const media = Object.values(project.sources).map(s => ({ id:s.id, name:s.name, kind:s.kind, duration:s.duration }));
  const data = { app:'minicut', version:2, savedAt:new Date().toISOString(), media };
  for (const k of SNAP_KEYS) data[k] = project[k];
  download(new Blob([JSON.stringify(data, null, 1)], { type:'application/json' }), `minicut-${stamp()}.json`);
  toast('프로젝트를 저장했습니다 (영상 파일은 들어가지 않습니다)');
}
function newProject(){
  if (!confirm('지금 편집 내용을 모두 지우고 새로 시작할까요?')) return;
  setPlaying(false);
  project = normalize(blankProject());
  history.past.length = 0; history.future.length = 0;
  lastSnap = snapshot();
  selection = { type:null, id:null };
  playhead = 0; zoomTouched = false;
  frameCache.clear();
  applyRatio(); refreshAll();
  toast('새 프로젝트를 시작했습니다');
}
let pendingProject = null, relinked = null;
async function openProjectFile(file){
  let data;
  try { data = JSON.parse(await file.text()); }
  catch(e){ toast('프로젝트 파일을 읽지 못했습니다', true); return; }
  if (!data || !Array.isArray(data.clips)){ toast('MiniCut 프로젝트 파일이 아닙니다', true); return; }
  pendingProject = data;
  relinked = Object.create(null);
  // 이미 열려 있는 파일 중 이름이 같은 것은 자동으로 연결해 둔다.
  for (const m of (data.media || [])){
    const hit = Object.values(project.sources).find(s => s.name === m.name && s.kind === m.kind);
    if (hit) relinked[m.id] = hit;
  }
  showRelinkModal();
}
function showRelinkModal(){
  const media = pendingProject.media || [];
  const rows = media.map(m => {
    const ok = relinked[m.id];
    return `<div><span>${m.kind === 'video' ? '🎬' : m.kind === 'audio' ? '🎵' : '🖼'} ${esc(m.name)}</span>
      <span class="${ok ? 'ok' : 'no'}">${ok ? '연결됨' : '없음'}</span></div>`;
  }).join('');
  const missing = media.filter(m => !relinked[m.id]).length;
  modal.innerHTML = `<h2>프로젝트 열기</h2>
    <div class="hint" style="margin:0 0 6px">프로젝트 파일에는 편집 내용만 들어 있습니다.
      아래 원본 파일을 골라 주세요(여러 개 한 번에 선택 가능, 파일 이름으로 맞춥니다).</div>
    <div class="filelist">${rows || '<div><span>필요한 파일 없음</span><span class="ok">—</span></div>'}</div>
    <div class="actions">
      <button id="rl-cancel">취소</button>
      <button id="rl-pick">파일 고르기</button>
      <button id="rl-go" class="primary">${missing ? `${missing}개 없이 열기` : '불러오기'}</button>
    </div>`;
  scrim.classList.add('on');
  modal.querySelector('#rl-cancel').onclick = () => { pendingProject = null; closeModal(); };
  modal.querySelector('#rl-pick').onclick = () => $('#file-relink').click();
  modal.querySelector('#rl-go').onclick = applyPendingProject;
}
async function relinkFiles(fileList){
  const media = (pendingProject && pendingProject.media) || [];
  for (const f of Array.from(fileList || [])){
    const m = media.find(x => x.name === f.name && !relinked[x.id]);
    if (!m) continue;
    const kind = kindOf(f);
    if (!kind) continue;
    try {
      const src = await loadSource(f, kind);
      project.sources[src.id] = src;
      relinked[m.id] = src;
    } catch(e){ toast(`"${f.name}" 을(를) 열지 못했습니다`, true); }
  }
  showRelinkModal();
}
function applyPendingProject(){
  const data = pendingProject;
  if (!data) return;
  setPlaying(false);
  const keepSources = project.sources;
  const p = blankProject();
  p.sources = keepSources;
  for (const k of SNAP_KEYS) if (k in data) p[k] = clone(data[k]);
  normalize(p);
  const map = id => (relinked[id] ? relinked[id].id : null);
  let dropped = 0;
  const keep = arr => arr.filter(o => {
    const n = map(o.srcId);
    if (!n){ dropped++; return false; }
    o.srcId = n; return true;
  });
  p.clips = keep(p.clips); p.overlays = keep(p.overlays); p.audio = keep(p.audio);
  project = p;
  history.past.length = 0; history.future.length = 0;
  lastSnap = snapshot();
  selection = { type:null, id:null };
  playhead = 0; zoomTouched = false;
  pendingProject = null; relinked = null;
  closeModal();
  applyRatio(); fitZoom(); refreshAll();
  requestAnimationFrame(() => { if (!zoomTouched){ fitZoom(); renderTimeline(); updateTransport(); } });
  toast(dropped ? `프로젝트를 열었습니다 (파일이 없어 ${dropped}개 항목은 뺐습니다)` : '프로젝트를 열었습니다');
}

/* ═══ 내보내기 ═══ */
let recorder = null, chunks = [], exportCancelled = false, restoreSize = null, exportWatch = null;
function pickMime(){
  if (typeof MediaRecorder === 'undefined') return null;
  const cands = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  return cands.find(t => MediaRecorder.isTypeSupported(t)) || null;
}
function openExportModal(){
  if (!project.clips.length) return;
  const mime = pickMime();
  if (!mime){
    toast('이 브라우저는 MediaRecorder 를 지원하지 않아 내보낼 수 없습니다. Chrome 또는 Edge 를 사용해 주세요.', true);
    return;
  }
  setPlaying(false);
  const ratio = project.canvas.ratio;
  const d7 = dimsFor(ratio, 720), d10 = dimsFor(ratio, 1080);
  modal.innerHTML = `<h2>내보내기</h2>
    <div class="row"><label>화질<span class="v">${ratio}</span></label>
      <select id="ex-res">
        <option value="720">720p (${d7.w} × ${d7.h})</option>
        <option value="1080" selected>1080p (${d10.w} × ${d10.h})</option>
      </select></div>
    <div class="hint">
      화면을 실시간으로 캡처하는 방식이라 영상 길이(약 ${fmt(totalDur())})만큼 시간이 걸립니다.<br>
      진행 중에는 탭을 최소화하지 말고 그대로 두세요. 결과는 WebM 파일로 저장됩니다.
    </div>
    <div class="actions">
      <button id="ex-cancel">취소</button>
      <button id="ex-go" class="primary">시작</button>
    </div>`;
  scrim.classList.add('on');
  modal.querySelector('#ex-cancel').onclick = closeModal;
  modal.querySelector('#ex-go').onclick = () => startExport(modal.querySelector('#ex-res').value, mime);
}
function closeModal(){ scrim.classList.remove('on'); modal.innerHTML = ''; }

async function startExport(res, mime){
  const { w:W, h:H } = dimsFor(project.canvas.ratio, Number(res) || 1080);
  restoreSize = { w:canvas.width, h:canvas.height };
  canvas.width = W; canvas.height = H;

  modal.innerHTML = `<h2>내보내는 중…</h2>
    <div class="empty-note" id="ex-stat" style="padding:0">준비하고 있습니다…</div>
    <div id="prog-track"><div id="prog-bar"></div></div>
    <div class="actions"><button id="ex-abort">취소</button></div>`;
  modal.querySelector('#ex-abort').onclick = abortExport;

  exporting = true;
  exportCancelled = false;
  chunks = [];
  syncHistoryButtons();
  setUIEnabled(false);

  ensureAudio();
  if (audioCtx && audioCtx.state === 'suspended'){ try { await audioCtx.resume(); } catch(e){} }

  playhead = 0;
  needSeek = true;
  syncVideo(); syncAudio();
  await waitSeeked(activeVideo, 1500);   // 첫 프레임이 디코드되기 전에 녹화가 시작되면 검은 화면이 남는다

  try {
    const vStream = canvas.captureStream(30);
    const tracks = vStream.getVideoTracks();
    if (streamDest) streamDest.stream.getAudioTracks().forEach(t => tracks.push(t));
    const mixed = new MediaStream(tracks);
    recorder = new MediaRecorder(mixed, { mimeType:mime, videoBitsPerSecond: Math.min(W,H) >= 1080 ? 12e6 : 6e6 });
    recorder.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    recorder.onstop = onRecorderStop;
    recorder.start(1000);
    // rAF 는 창이 가려지면 완전히 멈춘다. 종료 판정까지 rAF 에 맡기면 내보내기가
    // 영원히 끝나지 않으므로, 백그라운드에서도 도는 setInterval 로 한 번 더 지켜본다.
    exportWatch = setInterval(() => { if (exporting){ advanceByMedia(); updateExportProgress(); } }, 500);
  } catch(err){
    endExportUI();
    toast('녹화를 시작하지 못했습니다: ' + err.message, true);
    return;
  }
  setPlaying(true);
}
function waitSeeked(v, ms){
  return new Promise(resolve => {
    if (!v){ resolve(); return; }
    if (v.readyState >= 2 && !v.seeking){ setTimeout(resolve, 120); return; }
    const done = () => { v.removeEventListener('seeked', done); v.removeEventListener('canplay', done); resolve(); };
    v.addEventListener('seeked', done); v.addEventListener('canplay', done);
    setTimeout(done, ms);
  });
}
function updateExportProgress(){
  const bar = modal.querySelector('#prog-bar');
  const stat = modal.querySelector('#ex-stat');
  if (!bar) return;
  const total = totalDur() || 1;
  const p = clamp(playhead / total * 100, 0, 100);
  bar.style.width = p.toFixed(1) + '%';
  if (stat) stat.textContent = `${fmt(playhead)} / ${fmt(total)} — ${p.toFixed(0)}%`;
}
function finishExport(){
  if (recorder && recorder.state !== 'inactive'){
    setTimeout(() => { try { recorder.stop(); } catch(e){} }, 400);  // 마지막 프레임까지 담기게 잠깐 여유
  } else endExportUI();
}
function abortExport(){
  exportCancelled = true;
  setPlaying(false);
  if (recorder && recorder.state !== 'inactive'){ try { recorder.stop(); } catch(e){} }
  else endExportUI();
}
function onRecorderStop(){
  const blob = chunks.length ? new Blob(chunks, { type:'video/webm' }) : null;
  chunks = [];
  recorder = null;
  endExportUI();
  if (exportCancelled){ toast('내보내기를 취소했습니다'); return; }
  if (!blob || !blob.size){ toast('녹화된 데이터가 없습니다', true); return; }
  download(blob, `minicut-${stamp()}.webm`);
  toast('내보내기를 완료했습니다');
}
function endExportUI(){
  exporting = false;
  if (exportWatch){ clearInterval(exportWatch); exportWatch = null; }
  stallSince = 0;
  setPlaying(false);
  if (restoreSize){ canvas.width = restoreSize.w; canvas.height = restoreSize.h; restoreSize = null; }
  applyRatio();
  setUIEnabled(true);
  syncHistoryButtons();
  closeModal();
}
function setUIEnabled(on){
  ['#btn-open','#btn-split','#btn-dup','#btn-addsub','#btn-srt','#btn-export','#btn-play','#zoom']
    .forEach(s => { const e = $(s); if (e) e.disabled = !on || (!project.clips.length && s !== '#btn-open'); });
  inspector.style.pointerEvents = on ? '' : 'none';
  inspector.style.opacity = on ? '' : '.45';
  document.querySelectorAll('#tabs button').forEach(b => b.disabled = !on);
}

document.addEventListener('visibilitychange', () => {
  if (exporting && document.hidden){
    toast('창이 가려져 내보내기를 중단했습니다. 탭을 열어 둔 채 다시 시도해 주세요.', true);
    abortExport();
  } else if (playing && document.hidden){
    setPlaying(false);
  }
});

/* ═══ 단축키 ═══ */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (exporting && e.key !== 'Escape') return;
  const k = e.key;
  if (k === ' '){ e.preventDefault(); togglePlay(); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'd'){ e.preventDefault(); duplicateSelected(); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 's'){ e.preventDefault(); saveProject(); }
  else if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (k === 's' || k === 'S'){ e.preventDefault(); splitAtPlayhead(); }
  else if (k === 't' || k === 'T'){ e.preventDefault(); addSubtitle(); }
  else if (k === 'Delete' || k === 'Backspace'){ e.preventDefault(); deleteSelected(); }
  else if (k === 'ArrowLeft'){ e.preventDefault(); seekTo(playhead - (e.shiftKey ? 1 : 1/30)); scrollPlayheadIntoView(); }
  else if (k === 'ArrowRight'){ e.preventDefault(); seekTo(playhead + (e.shiftKey ? 1 : 1/30)); scrollPlayheadIntoView(); }
  else if (k === 'Escape' && scrim.classList.contains('on')){ exporting ? abortExport() : closeModal(); }
});

/* ═══ 상단바 / 탭 / 입력 배선 ═══ */
document.querySelectorAll('#tabs button').forEach(b => {
  b.onclick = () => { curTab = b.dataset.tab; syncTabs(); renderInspector(true); };
});
$('#btn-open').onclick   = () => $('#file').click();
$('#file').onchange       = e => { addFiles(e.target.files); e.target.value = ''; };
$('#file-audio').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('#file-image').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('#file-srt').onchange   = e => { if (e.target.files[0]) importSRT(e.target.files[0]); e.target.value = ''; };
$('#file-proj').onchange  = e => { if (e.target.files[0]) openProjectFile(e.target.files[0]); e.target.value = ''; };
$('#file-relink').onchange = e => { relinkFiles(e.target.files); e.target.value = ''; };
$('#btn-undo').onclick   = undo;
$('#btn-redo').onclick   = redo;
$('#btn-split').onclick  = splitAtPlayhead;
$('#btn-dup').onclick    = duplicateSelected;
$('#btn-addsub').onclick = () => addSubtitle();
$('#btn-srt').onclick    = exportSRT;
$('#btn-export').onclick = openExportModal;
$('#btn-play').onclick   = togglePlay;
$('#btn-full').onclick = () => {
  const w = $('#preview-wrap');
  if (document.fullscreenElement) document.exitFullscreen();
  else w.requestFullscreen && w.requestFullscreen().catch(() => toast('전체화면으로 전환할 수 없습니다', true));
};
$('#vol').addEventListener('input', e => {
  masterVolume = Number(e.target.value) / 100;
  if (masterGain) masterGain.gain.value = masterVolume;
});
$('#zoom').addEventListener('input', e => {
  pxPerSec = Number(e.target.value);
  zoomTouched = true;
  renderTimeline(); updateTransport();
});
$('#snap-on').addEventListener('change', e => { snapOn = e.target.checked; });
window.addEventListener('resize', () => { if (!zoomTouched) fitZoom(); renderTimeline(); updateTransport(); });
scrim.addEventListener('click', e => { if (e.target === scrim && !exporting) closeModal(); });

/* ═══ 갱신 ═══ */
function refreshAll(){
  needSeek = true;   // 편집이 일어나면 재생헤드 아래의 프레임이 달라진다
  const has = project.clips.length > 0;
  ['#btn-split','#btn-addsub','#btn-export','#btn-play'].forEach(s => $(s).disabled = !has || exporting);
  $('#btn-dup').disabled = !selection.type || exporting;
  $('#btn-srt').disabled = !project.subtitles.length || exporting;
  updateEmptyState();
  syncTabs();
  renderTimeline();
  updateTransport();
  renderInspector(true);
  syncHistoryButtons();
}

normalize(project);
applyRatio();
refreshAll();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>

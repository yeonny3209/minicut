<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniCut</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#1e222b; --border:#272b35;
    --text:#e6e8ee; --muted:#8b93a7; --accent:#5b8cff; --accent-dim:#3a5bb0;
    --danger:#ff6b6b; --radius:8px; --ease:120ms ease-out;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:13px; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius); padding:6px 12px; cursor:pointer;
    transition:background var(--ease),border-color var(--ease),opacity var(--ease);
  }
  button:hover:not(:disabled){background:#2a2f3a;border-color:#39404f}
  button:active:not(:disabled){background:#333a47;transform:translateY(1px)}
  button:disabled{opacity:.38;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#6d99ff;border-color:#6d99ff}
  button.ghost{background:transparent}
  a.linkbtn{
    display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--muted);
    border:1px solid var(--border);border-radius:var(--radius);padding:6px 11px;transition:all var(--ease);
  }
  a.linkbtn:hover{color:var(--text);border-color:#39404f;background:var(--panel2)}
  input[type=text],input[type=number],textarea,select{
    background:#11141a;border:1px solid var(--border);border-radius:6px;
    padding:6px 8px;width:100%;outline:none;transition:border-color var(--ease);
  }
  input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:var(--accent)}
  input[type=color]{
    -webkit-appearance:none;appearance:none;background:transparent;border:1px solid var(--border);
    border-radius:6px;width:100%;height:28px;padding:2px;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:4px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:#2b3040;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);
    margin-top:-4.5px;border:none;transition:transform var(--ease);
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
  input[type=range]::-moz-range-track{height:4px;background:#2b3040;border-radius:2px}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--accent)}
  input[type=checkbox]{accent-color:var(--accent)}

  #app{display:flex;flex-direction:column;height:100%}

  /* ---- top bar ---- */
  #topbar{
    display:flex;align-items:center;gap:7px;padding:8px 12px;
    background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto;flex-wrap:wrap;
  }
  #logo{font-weight:700;letter-spacing:.4px;margin-right:6px;display:flex;align-items:center;gap:7px}
  #logo .dot{width:9px;height:9px;border-radius:2px;background:var(--accent)}
  .spacer{flex:1}
  .sep{width:1px;height:20px;background:var(--border);margin:0 2px}

  /* ---- main ---- */
  #main{flex:1;display:flex;min-height:0}
  #inspector{
    flex:0 0 312px;width:312px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  #tabs{display:flex;border-bottom:1px solid var(--border);flex:0 0 auto;overflow-x:auto}
  #tabs button{
    border:0;border-radius:0;background:transparent;padding:9px 4px;flex:1;min-width:52px;
    color:var(--muted);font-size:11.5px;border-bottom:2px solid transparent;white-space:nowrap;
  }
  #tabs button:hover:not(:disabled){background:#1c212a}
  #tabs button.on{color:var(--text);border-bottom-color:var(--accent);background:#1a1f28}
  #ins-body{flex:1;overflow-y:auto;padding:12px;min-height:0}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#0b0d11}
  #preview-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:14px;position:relative;
  }
  #preview-wrap:fullscreen{background:#000;padding:0}
  #canvas{
    touch-action:none;max-width:100%;max-height:100%;background:#000;
    border-radius:var(--radius);box-shadow:0 6px 28px rgba(0,0,0,.5);display:block;
  }
  #preview-wrap:fullscreen #canvas{border-radius:0;box-shadow:none}
  #dropzone{
    position:absolute;inset:22px;border:2px dashed #2f3746;border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--muted);text-align:center;transition:border-color var(--ease),background var(--ease);
  }
  #dropzone.hot{border-color:var(--accent);background:rgba(91,140,255,.07);color:var(--text)}
  #dropzone .big{font-size:15px;color:var(--text)}
  #dropzone svg{opacity:.5}
  #transport{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px;
    border-top:1px solid var(--border);background:var(--panel);
  }
  #time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:132px}
  #time b{color:var(--text);font-weight:600}
  .vol{display:flex;align-items:center;gap:6px;width:120px}

  /* ---- timeline ---- */
  #timeline{
    flex:0 0 250px;height:250px;background:var(--panel);border-top:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  #tl-head{
    display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--border);
    font-size:12px;color:var(--muted);flex:0 0 auto;
  }
  #tl-scroll{flex:1;overflow-x:auto;overflow-y:auto;position:relative;min-height:0}
  #tl-inner{position:relative;min-width:100%}
  #ruler{position:absolute;top:0;left:0;height:22px;display:block;z-index:12}
  #lane-clips{position:absolute;top:24px;height:50px;left:0;right:0}
  #lane-fx,#lane-subs,#lane-ovl,#lane-aud{position:absolute;left:0;right:0}
  .lane-label{
    position:absolute;left:4px;top:-1px;font-size:10px;color:#5d6577;pointer-events:none;
    letter-spacing:.3px;z-index:2;text-shadow:0 1px 2px #181b22;
  }
  .clip{
    position:absolute;top:0;height:100%;border-radius:6px;overflow:hidden;
    background:#2b3f70 center/cover no-repeat;border:1px solid var(--accent-dim);
    cursor:grab;user-select:none;transition:box-shadow var(--ease);
  }
  .clip.sel{border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
  .clip.dragging{cursor:grabbing;opacity:.75;z-index:5}
  .clip .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(91,140,255,.38),rgba(20,28,52,.72))}
  .clip .name{
    position:absolute;left:6px;right:6px;bottom:4px;font-size:10px;color:#e8ecff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.8);
  }
  .clip .meta{
    position:absolute;left:6px;top:4px;font-size:10px;color:#cdd6f5;
    text-shadow:0 1px 2px rgba(0,0,0,.8);font-variant-numeric:tabular-nums;
  }
  .clip .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;background:rgba(255,255,255,.14)}
  .clip .h:hover{background:rgba(255,255,255,.42)}
  .clip .h.l{left:0} .clip .h.r{right:0}
  .clip .mute{position:absolute;right:8px;top:4px;font-size:10px;opacity:.9}
  /* 클립 사이 전환 배지 */
  .trans{
    position:absolute;top:16px;width:20px;height:20px;margin-left:-10px;border-radius:5px;
    background:#233046;border:1px solid #3d5680;color:#a9c2ef;
    display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;
    z-index:6;user-select:none;transition:all var(--ease);
  }
  .trans:hover{background:#2e3f5c;color:#fff;transform:scale(1.12)}
  .trans.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bar{
    position:absolute;height:20px;border-radius:5px;cursor:grab;user-select:none;overflow:hidden;
  }
  .bar.sel{border-width:2px;border-color:#fff}
  .bar span{
    position:absolute;left:8px;right:8px;top:3px;font-size:10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bar .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize;background:rgba(255,255,255,.18)}
  .bar .h:hover{background:rgba(255,255,255,.45)}
  .bar .h.l{left:0} .bar .h.r{right:0}
  .bar.sub{background:#3c6b4e;border:1px solid #4f8b66} .bar.sub span{color:#e6ffe9}
  .bar.fx{background:#6b4fc4;border:1px solid #8f75e6}  .bar.fx span{color:#efe9ff}
  .bar.ovl{background:#a8622c;border:1px solid #d1813f} .bar.ovl span{color:#ffeedd}
  .bar.aud{background:#1f6b73;border:1px solid #2f9aa5} .bar.aud span{color:#dcfbff}
  #playhead{
    position:absolute;top:0;bottom:0;width:1px;background:#ff5e5e;pointer-events:none;z-index:13;
    will-change:transform;
  }
  #playhead::before{
    content:"";position:absolute;top:0;left:-5px;width:11px;height:9px;background:#ff5e5e;
    clip-path:polygon(0 0,100% 0,50% 100%);
  }
  #snapline{position:absolute;top:22px;bottom:0;width:1px;background:#ffd166;display:none;pointer-events:none;z-index:11}

  /* ---- inspector blocks ---- */
  .block{margin-bottom:16px}
  .block > h3{
    margin:0 0 9px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .row{margin-bottom:10px}
  .row > label{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;color:var(--muted);font-size:12px}
  .row > label .v{color:var(--text);font-variant-numeric:tabular-nums}
  .slider-row{display:flex;align-items:center;gap:8px}
  .slider-row input[type=range]{flex:1}
  .slider-row input[type=number]{width:58px;flex:0 0 auto;text-align:right;padding:4px 6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);
    cursor:pointer;font-size:12px;transition:all var(--ease);
  }
  .chip:hover{border-color:#3d4557}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;flex:1;padding:5px 0;background:var(--panel2);font-size:12px}
  .seg button + button{border-left:1px solid var(--border)}
  .seg button.on{background:var(--accent);color:#fff}
  .empty-note{color:var(--muted);line-height:1.7;padding:6px 2px}
  .hint{color:#6d758a;font-size:11px;line-height:1.55;margin-top:6px}
  details.sec{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:#141820}
  details.sec > summary{
    cursor:pointer;padding:8px 10px;font-size:12px;color:var(--text);list-style:none;
    display:flex;align-items:center;gap:6px;user-select:none;
  }
  details.sec > summary::-webkit-details-marker{display:none}
  details.sec > summary::before{
    content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);
    transform:rotate(-45deg);transition:transform var(--ease);margin-right:2px;
  }
  details.sec[open] > summary::before{transform:rotate(45deg)}
  details.sec > summary:hover{background:#1a1f28;border-radius:var(--radius)}
  .sec-body{padding:4px 10px 10px}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button.preset{
    padding:9px 4px;background:#0d0f14;border:1px solid var(--border);font-size:15px;
    display:flex;align-items:center;justify-content:center;min-height:42px;
  }
  button.preset:hover:not(:disabled){border-color:var(--accent);background:#10131a}
  .filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  button.filt{padding:0;overflow:hidden;position:relative;height:60px;border:1px solid var(--border)}
  button.filt:hover:not(:disabled){border-color:var(--accent)}
  button.filt i{position:absolute;inset:0;display:block;background:
    linear-gradient(135deg,#ff9a3c 0%,#e35d6a 32%,#4a6fd6 66%,#3ec9a7 100%);}
  button.filt b{
    position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:600;padding:3px 2px;
    background:rgba(8,10,14,.72);color:#fff;
  }
  .ratios{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  button.ratio{
    display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;font-size:10px;
    color:var(--muted);
  }
  button.ratio.on{border-color:var(--accent);color:#fff;background:#1d2436}
  button.ratio i{display:block;border:1.5px solid currentColor;border-radius:2px}
  .check{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer}
  .tlist{display:flex;flex-direction:column;gap:5px}
  .tlist button{text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .tlist button .t{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .tlist button.on{border-color:var(--accent);background:#1d2436}

  /* ---- toast / modal ---- */
  #toasts{position:fixed;right:14px;bottom:14px;z-index:1000;display:flex;flex-direction:column;gap:8px}
  .toast{
    background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:9px 13px;max-width:330px;box-shadow:0 8px 24px rgba(0,0,0,.45);
    animation:slidein var(--ease);line-height:1.5;
  }
  .toast.err{border-left-color:var(--danger)}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #scrim{
    position:fixed;inset:0;background:rgba(6,8,12,.72);display:none;z-index:900;
    align-items:center;justify-content:center;
  }
  #scrim.on{display:flex}
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;
    width:400px;max-width:calc(100vw - 32px);max-height:calc(100vh - 60px);overflow-y:auto;
    box-shadow:0 18px 60px rgba(0,0,0,.6);
  }
  .modal h2{margin:0 0 14px;font-size:16px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  #prog-track{height:6px;background:#11141a;border-radius:3px;overflow:hidden;margin-top:12px}
  #prog-bar{height:100%;width:0;background:var(--accent);transition:width 100ms linear}
  .filelist{display:flex;flex-direction:column;gap:5px;margin:10px 0}
  .filelist div{
    display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border:1px solid var(--border);
    border-radius:6px;background:#11141a;font-size:12px;
  }
  .filelist .ok{color:#6ddc9a} .filelist .no{color:var(--danger)}

  @media (max-width:900px){
    #main{flex-direction:column-reverse}
    #inspector{flex:0 0 auto;width:100%;max-height:46vh;border-right:0;border-top:1px solid var(--border)}
    #timeline{flex:0 0 230px;height:230px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="logo"><span class="dot"></span>MiniCut</div>
    <button id="btn-open">영상 불러오기</button>
    <div class="sep"></div>
    <button id="btn-undo" title="실행취소 (Ctrl+Z)" disabled>실행취소</button>
    <button id="btn-redo" title="다시실행 (Ctrl+Shift+Z)" disabled>다시실행</button>
    <div class="sep"></div>
    <button id="btn-split" title="재생헤드에서 분할 (S)" disabled>분할</button>
    <button id="btn-dup" title="선택 항목 복제 (Ctrl+D)" disabled>복제</button>
    <button id="btn-addsub" title="자막 추가 (T)" disabled>+ 자막</button>
    <div class="spacer"></div>
    <a class="linkbtn" href="guide.html" target="_blank" rel="noopener" title="기능 설명서">사용법</a>
    <button id="btn-srt" disabled>SRT 저장</button>
    <button id="btn-export" class="primary" disabled>내보내기</button>
    <input id="file"       type="file" accept="video/*,.mp4,.webm,.mov,.m4v" multiple hidden>
    <input id="file-audio" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac" multiple hidden>
    <input id="file-image" type="file" accept="image/*,.png,.jpg,.jpeg,.gif,.webp,.svg" multiple hidden>
    <input id="file-srt"   type="file" accept=".srt,text/plain" hidden>
    <input id="file-proj"  type="file" accept=".json,.mcut,application/json" hidden>
    <input id="file-relink" type="file" accept="video/*,audio/*,image/*" multiple hidden>
  </div>

  <div id="main">
    <aside id="inspector">
      <div id="tabs">
        <button data-tab="sel" class="on">선택</button>
        <button data-tab="fx">효과</button>
        <button data-tab="filter">필터</button>
        <button data-tab="add">꾸미기</button>
        <button data-tab="proj">프로젝트</button>
      </div>
      <div id="ins-body"></div>
    </aside>

    <section id="stage">
      <div id="preview-wrap">
        <canvas id="canvas" width="1280" height="720"></canvas>
        <div id="dropzone">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M10 9.2v5.6l5-2.8z" fill="currentColor" stroke="none"/>
          </svg>
          <div class="big">영상을 끌어다 놓으세요</div>
          <div>영상 · 음악 · 이미지 모두 받습니다 — 파일은 기기 밖으로 나가지 않습니다</div>
        </div>
      </div>
      <div id="transport">
        <button id="btn-play" disabled title="재생/정지 (Space)">▶</button>
        <div id="time"><b>00:00.00</b> / 00:00.00</div>
        <div class="spacer"></div>
        <div class="vol">
          <span style="color:var(--muted)">🔊</span>
          <input id="vol" type="range" min="0" max="100" value="100">
        </div>
        <button id="btn-full" class="ghost" title="전체화면">⛶</button>
      </div>
    </section>
  </div>

  <div id="timeline">
    <div id="tl-head">
      <span>타임라인</span>
      <label class="check" style="font-size:11px"><input id="snap-on" type="checkbox" checked> 자석</label>
      <span class="spacer" style="flex:1"></span>
      <span>확대</span>
      <input id="zoom" type="range" min="4" max="240" value="40" style="width:110px">
    </div>
    <div id="tl-scroll">
      <div id="tl-inner">
        <canvas id="ruler" height="22"></canvas>
        <div id="lane-clips"></div>
        <div id="lane-fx"><div class="lane-label">효과</div></div>
        <div id="lane-ovl"><div class="lane-label">스티커</div></div>
        <div id="lane-subs"><div class="lane-label">자막</div></div>
        <div id="lane-aud"><div class="lane-label">음악</div></div>
        <div id="snapline"></div>
        <div id="playhead"></div>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<div id="scrim"><div class="modal" id="modal"></div></div>
<script>
(() => {
"use strict";

/* ═══ 상수 ═══ */
// 자막 크기·블러 반경 등 모든 픽셀값의 기준. 캔버스의 '짧은 변'을 1080 으로 보고 환산하므로
// 가로(1920×1080)든 세로(1080×1920)든 프리뷰든 내보내기든 같은 그림이 나온다.
const REF = 1080;
const unit = (W, H) => Math.min(W, H) / REF;
const MIN_CLIP = 0.1;
const HISTORY_MAX = 60;

const RATIOS = {
  '16:9': { w:16, h:9,  label:'가로',   prevW:1280, prevH:720  },
  '9:16': { w:9,  h:16, label:'세로',   prevW:720,  prevH:1280 },

function dimsFor(ratio, shortSide){
  const r = RATIOS[ratio] || RATIOS['16:9'];
  let w, h;
  if (r.w <= r.h){ w = shortSide; h = Math.round(shortSide * r.h / r.w); }
  else           { h = shortSide; w = Math.round(shortSide * r.w / r.h); }
  return { w: w - (w % 2), h: h - (h % 2) };
}

/* ═══ 시간 모델 ═══
   전역시간(타임라인 시간)과 소스시간(원본 currentTime)은 speed 때문에 1:1이 아니다.
   전역 1초 = 소스 speed초. 아래 두 함수가 그 환산을 독점한다. */
const clipDur = c => Math.max(0, (c.outPoint - c.inPoint) / c.speed);
const totalDur = () => project.clips.reduce((a,c) => a + clipDur(c), 0);

function locate(t){
  const cs = project.clips;
  if (!cs.length) return null;
  let acc = 0;
  for (let i = 0; i < cs.length; i++){
    const d = clipDur(cs[i]);
    if (t < acc + d || i === cs.length - 1){
      const local = clamp(t - acc, 0, d);
      return {
        index:i, clip:cs[i], start:acc, dur:d, local,
        progress: d > 0 ? local / d : 0,
        sourceTime: cs[i].inPoint + local * cs[i].speed
      };
    }
    acc += d;
  }
  return null;
}
function clipStartOf(i){
  let acc = 0;
  for (let k = 0; k < i; k++) acc += clipDur(project.clips[k]);
  return acc;
}

function normalize(p){
  p.canvas = { ratio:'16:9', bg:'blur', bgColor:'#101014', ...(p.canvas || {}) };
  if (!RATIOS[p.canvas.ratio]) p.canvas.ratio = '16:9';
  p.adjustments = { ...ADJ_DEF, ...(p.adjustments || {}) };
  for (const k of ['clips','effects','overlays','subtitles','audio']) if (!Array.isArray(p[k])) p[k] = [];
  for (const c of p.clips){
    Object.assign(c, { ...CLIP_DEF, ...c });
    c.tf = { ...TF_DEF, ...(c.tf || {}) };
    c.trans = { ...TRANS_DEF, ...(c.trans || {}) };
  }
  for (const o of p.overlays) Object.assign(o, { ...OVL_DEF, ...o });
  for (const a of p.audio) Object.assign(a, { ...AUD_DEF, ...a });
  for (const s of p.subtitles) s.style = { ...clone(SUB_STYLE_DEF), ...(s.style || {}) };
  return p;
}

/* ═══ 오디오 그래프 ═══
   내보내기 중 클립이 바뀌어도 MediaRecorder에 물린 오디오 트랙은 교체할 수 없다.
   그래서 모든 미디어를 하나의 믹스 노드로 합쳐 고정된 트랙 하나를 만든다.
   소스마다 gain 을 두어 클립 볼륨·음악 페이드를 이 그래프 안에서 처리한다. */
let audioCtx = null, masterGain = null, streamDest = null;
function ensureAudio(){
  if (audioCtx) return true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = masterVolume;
    streamDest = audioCtx.createMediaStreamDestination();
    masterGain.connect(audioCtx.destination);
    masterGain.connect(streamDest);
    return true;
  } catch(e){ audioCtx = null; return false; }
}
function wireMedia(src){
  if (src.kind === 'image' || !ensureAudio()) return;
  try {
    const node = audioCtx.createMediaElementSource(src.el);
    src.gain = audioCtx.createGain();
    node.connect(src.gain);
    src.gain.connect(masterGain);
  } catch(e){ /* 이미 연결된 엘리먼트 */ }
}
const setGain = (src, v) => {
  if (!src) return;
  if (src.gain) src.gain.gain.value = v;
  else if (src.el && 'volume' in src.el) src.el.volume = clamp(v, 0, 1);
};

/* ═══ 소스 로딩 ═══ */
const kindOf = file => {
  const t = file.type || '';
  if (t.startsWith('video/')) return 'video';
  if (t.startsWith('audio/')) return 'audio';
  if (t.startsWith('image/')) return 'image';
  if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(file.name)) return 'video';
  if (/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(file.name)) return 'audio';
  if (/\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(file.name)) return 'image';
  return null;
};

async function addFiles(fileList){
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const added = { video:0, audio:0, image:0 };
  for (const f of files){
    const kind = kindOf(f);
    if (!kind){ toast(`"${f.name}" 은(는) 지원하지 않는 형식입니다`, true); continue; }
    try {
      const src = await loadSource(f, kind);
      project.sources[src.id] = src;
      if (kind === 'video'){
        project.clips.push({ id:uid('clip'), srcId:src.id, inPoint:0, outPoint:src.duration,
          ...CLIP_DEF, tf:{ ...TF_DEF }, trans:{ ...TRANS_DEF } });
      } else if (kind === 'audio'){
        project.audio.push({ id:uid('aud'), srcId:src.id, start:playhead,
          end:playhead + src.duration, ...AUD_DEF });
      } else {
        const t = totalDur();
        project.overlays.push({ id:uid('ovl'), srcId:src.id,
          start:clamp(playhead, 0, Math.max(t - 0.3, 0)),
          end:Math.min(playhead + 3, Math.max(t, playhead + 1)), ...OVL_DEF });
      }
      added[kind]++;
    } catch(err){
      toast(`"${f.name}" 을(를) 열지 못했습니다: ${err.message}`, true);
    }
  }
  const n = added.video + added.audio + added.image;
  if (!n) return;
  sortRanges();
  pushHistory();
  if (!selection.id && project.clips.length) select('clip', project.clips[project.clips.length - 1].id);
  fitZoom();
  refreshAll();
  requestAnimationFrame(() => { if (!zoomTouched){ fitZoom(); renderTimeline(); updateTransport(); } });
  const parts = [];
  if (added.video) parts.push(`영상 ${added.video}개`);
  if (added.audio) parts.push(`음악 ${added.audio}개`);
  if (added.image) parts.push(`이미지 ${added.image}개`);
  toast(parts.join(' · ') + '를 추가했습니다');
}

/* MediaRecorder 가 만든 WebM(MiniCut 이 내보낸 파일 포함)은 길이 정보를 헤더에 못 쓴 채 끝나서
   duration 이 Infinity, seekable 이 비어 있는 상태로 열린다. 파일이 깨진 게 아니라 길이만 비어 있는 것이라,
   아주 먼 시각으로 시킹시켜 브라우저가 끝까지 스캔하게 만들면 길이가 확정되고 탐색도 정상이 된다. */
function recoverDuration(el, timeoutMs = 15000){
  return new Promise(resolve => {
    const good = () => isFinite(el.duration) && el.duration > 0;
    const finish = ok => {
      clearTimeout(timer);
      el.removeEventListener('durationchange', check);
      el.removeEventListener('timeupdate', check);
      try { el.currentTime = 0; } catch(e){}
      resolve(ok);
    };
    const check = () => { if (good()) finish(true); };
    const timer = setTimeout(() => finish(good()), timeoutMs);
    el.addEventListener('durationchange', check);
    el.addEventListener('timeupdate', check);
    try { el.currentTime = 1e101; } catch(e){ finish(false); }
  });
}

function loadSource(file, kind){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const fail = () => { URL.revokeObjectURL(url); reject(new Error('읽을 수 없는 파일입니다')); };
    const base = { id:uid('src'), name:file.name, kind, url, size:file.size };

    if (kind === 'image'){
      const img = new Image();
      img.onload = () => resolve({ ...base, el:img, duration:0, thumb:url, w:img.naturalWidth, h:img.naturalHeight });
      img.onerror = fail;
      img.src = url;
      return;
    }
    const el = document.createElement(kind === 'video' ? 'video' : 'audio');
    el.preload = 'auto'; el.crossOrigin = 'anonymous';
    if (kind === 'video') el.playsInline = true;
    el.addEventListener('error', fail, { once:true });
    el.addEventListener('loadedmetadata', async () => {
      if (!isFinite(el.duration) || el.duration <= 0){
        if (!(await recoverDuration(el))) return fail();
      }
      const src = { ...base, el, duration:el.duration, thumb:null };
      wireMedia(src);
      if (kind === 'video') src.thumb = await grabThumb(el).catch(() => null);
      resolve(src);
    }, { once:true });
    el.src = url;
  });
}
function grabThumb(v){
  return new Promise(resolve => {
    const c = document.createElement('canvas');
    c.width = 192; c.height = 108;
    const cc = c.getContext('2d');
    const done = () => {
      v.removeEventListener('seeked', done);
      try {
        const r = containRect(v.videoWidth || 16, v.videoHeight || 9, 192, 108);
        cc.fillStyle = '#000'; cc.fillRect(0, 0, 192, 108);
        cc.drawImage(v, r.x, r.y, r.w, r.h);
        resolve(c.toDataURL('image/jpeg', .6));
      } catch(e){ resolve(null); }
    };
    v.addEventListener('seeked', done);
    setTimeout(() => { v.removeEventListener('seeked', done); resolve(null); }, 2500);
    try { v.currentTime = Math.min(0.15, v.duration * 0.05); } catch(e){ resolve(null); }
  });
}
function containRect(vw, vh, W, H){
  const s = Math.min(W / vw, H / vh);
  const w = vw * s, h = vh * s;
  return { x:(W - w) / 2, y:(H - h) / 2, w, h };
}

/* ═══ 화면비 ═══ */
function applyRatio(){
  const r = RATIOS[project.canvas.ratio] || RATIOS['16:9'];
  if (canvas.width !== r.prevW || canvas.height !== r.prevH){
    canvas.width = r.prevW; canvas.height = r.prevH;
  }
  canvas.style.aspectRatio = `${r.w} / ${r.h}`;
}

/* ═══ 구간 효과 ═══
   효과는 클립이 아니라 타임라인 전역 시간에 붙는다. 그래서 컷·순서 변경을 해도 사용자가
   지정한 "이 장면에서만" 이 어긋나지 않는다(자막과 같은 방식). 각 효과는 자기 구간의
   진행도 p(0~1)를 받아 동작하며, 같은 종류가 겹치면 나중에 시작한 쪽이 이긴다. */
function activeEffects(t){
  const m = Object.create(null);
  for (const e of project.effects){
    if (t < e.start || t >= e.end) continue;
    const cur = m[e.type];
    if (!cur || e.start >= cur.start){
      m[e.type] = { ...e, p:clamp((t - e.start) / Math.max(e.end - e.start, 1e-6), 0, 1) };
    }
  }
  return m;
}
function buildFilter(fx, W, H){
  const a = project.adjustments;
  let f = `brightness(${a.brightness}%) contrast(${a.contrast}%) saturate(${a.saturation}%)`;
  if (fx.filter && FILTER_CSS[fx.filter.preset]) f += ' ' + FILTER_CSS[fx.filter.preset];
  if (fx.grayscale) f += ' grayscale(1)';
  if (fx.sepia)     f += ' sepia(1)';
  if (fx.invert)    f += ' invert(1)';
  if (fx.blur && fx.blur.amount > 0) f += ` blur(${(fx.blur.amount * unit(W,H)).toFixed(2)}px)`;
  return f;
}
const shakeAmp = (fx, W, H) => fx.shake
  ? ({ low:0.004, mid:0.009, high:0.02 }[fx.shake.level] || 0.009) * Math.min(W,H) : 0;
function fadeAlpha(fx){
  let a = 0;
  if (fx.fadeIn)  a = Math.max(a, 1 - fx.fadeIn.p);
  if (fx.fadeOut) a = Math.max(a, fx.fadeOut.p);
  return clamp(a, 0, 1);
}
// 플래시는 구간 안에서 times 번 깜빡인다. 각 번쩍임은 시작이 가장 밝고 빠르게 사라진다.
function flashAlpha(fx){
  if (!fx.flash) return 0;
  const n = Math.max(1, fx.flash.times | 0);
  const q = (fx.flash.p * n) % 1;
  return clamp(1 - q, 0, 1) ** 1.6;
}

/* ═══ 마지막 성한 프레임 캐시 ═══
   video 가 시킹 중이면 readyState 가 2 아래로 떨어지고 drawImage 는 아무것도 그리지 않는다.
   그대로 두면 스크럽할 때마다 화면이 검게 깜빡이므로, 디코드된 프레임을 100ms 마다
   오프스크린에 복사해 두었다가 그 순간에는 캐시본을 대신 그린다.
   전환 효과에서 "직전 클립의 마지막 프레임" 도 이 캐시에서 가져온다. */
const frameCache = new Map();
function pickPainter(src, v){
  if (!src || !v || !v.videoWidth) return null;
  let e = frameCache.get(src.id);
  if (v.readyState >= 2){
    const now = performance.now();
    if (!e || e.c.width !== v.videoWidth || e.c.height !== v.videoHeight){
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      e = { c, ctx:c.getContext('2d'), t:0, ok:false };
      frameCache.set(src.id, e);
    }
    if (now - e.t > 100){
      try { e.ctx.drawImage(v, 0, 0); e.t = now; e.ok = true; } catch(err){}
    }
    return v;
  }
  return e && e.ok ? e.c : null;
}

/* ═══ 오프스크린 풀 ═══ */
const offs = Object.create(null);
function off(name, W, H){
  let o = offs[name];
  if (!o){ const c = document.createElement('canvas'); o = offs[name] = { c, x:c.getContext('2d') }; }
  if (o.c.width !== W || o.c.height !== H){ o.c.width = W; o.c.height = H; }
  else o.x.clearRect(0, 0, W, H);
  return o;
}

/* ═══ 배치 계산 ═══
   fit='contain' 은 영상 전체를 넣고 남는 곳을 배경으로, 'cover' 는 화면을 꽉 채우도록 잘라낸다.
   세로 영상 편집에서 이 둘의 차이가 가장 크게 드러난다. */
function fitRect(vw, vh, W, H, mode){
  if (mode === 'cover'){
    const s = Math.max(W / vw, H / vh);
    const sw = W / s, sh = H / s;
    return { sx:(vw - sw) / 2, sy:(vh - sh) / 2, sw, sh, dw:W, dh:H };
  }
  const s = Math.min(W / vw, H / vh);
  return { sx:0, sy:0, sw:vw, sh:vh, dw:vw * s, dh:vh * s };
}
function drawBackground(c, W, H, painter, vw, vh){
  const bg = project.canvas.bg;
  c.save();
  c.setTransform(1,0,0,1,0,0); c.filter = 'none'; c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  if (bg === 'blur' && painter && vw){
    const r = fitRect(vw, vh, W, H, 'cover');
    c.filter = `blur(${(Math.min(W,H) * 0.06).toFixed(1)}px) brightness(0.6) saturate(1.2)`;
    // 블러는 가장자리를 투명하게 번지게 하므로 살짝 확대해 테두리 틈을 없앤다.
    const pad = Math.min(W,H) * 0.1;
    try { c.drawImage(painter, r.sx, r.sy, r.sw, r.sh, -pad, -pad, W + pad*2, H + pad*2); } catch(e){}
  } else {
    c.fillStyle = bg === 'white' ? '#ffffff' : bg === 'color' ? project.canvas.bgColor : '#000000';
    c.fillRect(0, 0, W, H);
  }
  c.restore();
}

/* ═══ 한 클립을 한 장으로 합성 ═══
   배경 + 영상(변형·효과) + 색온도/비네트/플래시/페이드까지. 전환 효과는 이 결과물 두 장을
   섞는 방식이라, 프리뷰든 내보내기든 전환 중에도 같은 파이프라인만 지나간다. */
function compositeClip(c, clip, local, dur, W, H, t){
  const fx = activeEffects(t);
  const src = clip ? project.sources[clip.srcId] : null;
  const v = src && src.el;
  const painter = pickPainter(src, v);
  const vw = v && v.videoWidth, vh = v && v.videoHeight;

  drawBackground(c, W, H, painter, vw, vh);

  if (painter && vw){
    // 후처리가 필요한 효과는 레이어에 먼저 그린 뒤 통째로 변형한다.
    const post = fx.pixelate || fx.mirror || fx.glitch;
    const layer = post ? off('layer', W, H) : null;
    const target = post ? layer.x : c;
    if (post){ layer.x.save(); layer.x.setTransform(1,0,0,1,0,0); layer.x.clearRect(0,0,W,H); layer.x.restore(); }

    drawVideoLayer(target, painter, vw, vh, clip, fx, W, H, local, dur);

    if (post){
      let img = layer.c;
      if (fx.pixelate) img = pixelate(img, W, H, fx.pixelate.amount);
      if (fx.mirror)   img = mirrorLayer(img, W, H, fx.mirror.dir);
      if (fx.glitch)   { drawGlitch(c, img, W, H, fx.glitch.level, t); }
      else { c.save(); c.setTransform(1,0,0,1,0,0); c.drawImage(img, 0, 0, W, H); c.restore(); }
    }
  }

  const a = project.adjustments;
  // 색온도 — 따뜻하면 주황, 차가우면 파랑을 overlay 로 얹는다.
  if (a.temperature !== 0){
    c.save();
    c.globalCompositeOperation = 'overlay';
    c.globalAlpha = Math.min(Math.abs(a.temperature) / 100 * 0.42, 0.42);
    c.fillStyle = a.temperature > 0 ? 'rgb(255,150,40)' : 'rgb(40,140,255)';
    c.fillRect(0, 0, W, H);
    c.restore();
  }
  // 비네트 — multiply 라 중앙(흰색)은 그대로 두고 가장자리만 어두워진다.
  if (a.vignette > 0){
    c.save();
    c.globalCompositeOperation = 'multiply';
    const g = c.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.22, W/2, H/2, Math.max(W,H) * 0.72);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(1, `rgba(0,0,0,${(a.vignette/100).toFixed(3)})`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.restore();
  }
  const fl = flashAlpha(fx);
  if (fl > 0){
    c.save(); c.globalAlpha = fl * 0.92;
    c.fillStyle = fx.flash.color || '#ffffff'; c.fillRect(0, 0, W, H); c.restore();
  }
  const fa = fadeAlpha(fx);
  if (fa > 0){
    c.save(); c.globalAlpha = fa; c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.restore();
  }
}

function drawVideoLayer(c, painter, vw, vh, clip, fx, W, H, local, dur){
  const tf = clip.tf || TF_DEF;
  const base = fitRect(vw, vh, W, H, clip.fit);
  let { sx, sy, sw, sh } = base;

  // 켄번즈 — 소스 사각형을 서서히 좁혀 확대한다(화질 손실 없음).
  if (fx.kenburns){
    const e = fx.kenburns;
    const z = e.dir === 'in' ? 1 + (e.zoom - 1) * e.p : e.zoom - (e.zoom - 1) * e.p;
    const nw = sw / z, nh = sh / z;
    sx += (sw - nw) / 2; sy += (sh - nh) / 2; sw = nw; sh = nh;
  }
  let scale = tf.scale;
  if (fx.zoomPulse){
    const e = fx.zoomPulse;
    scale *= 1 + (e.amount / 100) * 0.5 * (1 - Math.cos(e.p * Math.PI * 2 * Math.max(1, e.speed)));
  }
  let rot = tf.rot * Math.PI / 180;
  if (fx.spin) rot += fx.spin.turns * Math.PI * 2 * fx.spin.p;

  const amp = shakeAmp(fx, W, H);
  const ox = amp ? (Math.random() * 2 - 1) * amp : 0;
  const oy = amp ? (Math.random() * 2 - 1) * amp : 0;
  // 흔들림·회전은 가장자리에 빈 틈을 만드므로 살짝 키워 덮는다.
  const pad = (amp ? 1 + (amp * 3.4) / Math.min(W,H) : 1) * (fx.spin || tf.rot ? 1.42 : 1);

  c.save();
  c.filter = buildFilter(fx, W, H);
  c.translate(W/2 + tf.x * W + ox, H/2 + tf.y * H + oy);
  c.rotate(rot);
  c.scale((tf.flipH ? -1 : 1) * scale * pad, (tf.flipV ? -1 : 1) * scale * pad);
  try { c.drawImage(painter, sx, sy, sw, sh, -base.dw/2, -base.dh/2, base.dw, base.dh); } catch(e){}
  c.restore();
}

function pixelate(img, W, H, amount){
  const n = clamp(Math.round(amount), 2, 120);
  const sw = Math.max(2, Math.round(W / n)), sh = Math.max(2, Math.round(H / n));
  const small = off('px1', sw, sh);
  small.x.imageSmoothingEnabled = true;
  small.x.drawImage(img, 0, 0, sw, sh);
  const outp = off('px2', W, H);
  outp.x.imageSmoothingEnabled = false;
  outp.x.drawImage(small.c, 0, 0, sw, sh, 0, 0, W, H);
  outp.x.imageSmoothingEnabled = true;
  return outp.c;
}
function mirrorLayer(img, W, H, dir){
  const o = off('mir', W, H);
  const x = o.x;
  x.save();
  if (dir === 'v'){
    x.drawImage(img, 0, 0, W, H/2, 0, 0, W, H/2);
    x.translate(0, H); x.scale(1, -1);
    x.drawImage(img, 0, 0, W, H/2, 0, 0, W, H/2);
  } else {
    x.drawImage(img, 0, 0, W/2, H, 0, 0, W/2, H);
    x.translate(W, 0); x.scale(-1, 1);
    x.drawImage(img, 0, 0, W/2, H, 0, 0, W/2, H);
  }
  x.restore();
  return o.c;
}
// 가로 띠를 어긋나게 밀고 적/청 잔상을 겹쳐 아날로그 글리치처럼 보이게 한다.
function drawGlitch(c, img, W, H, level, t){
  // tint 는 'lighter' 합성이라 값을 키우면 화면이 흰색으로 날아간다. 어긋난 띠가 주인공이고
  // 색 잔상은 거들기만 하도록 낮게 잡는다.
  const cfg = { low:{ n:3, amp:0.012, tint:0.05 }, mid:{ n:7, amp:0.03, tint:0.09 }, high:{ n:13, amp:0.065, tint:0.14 } }[level]
            || { n:7, amp:0.03, tint:0.09 };
  const seed = Math.floor(t * 14);
  let s = seed * 9301 + 49297;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  c.save(); c.setTransform(1,0,0,1,0,0);
  c.drawImage(img, 0, 0, W, H);
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = cfg.tint;
  c.drawImage(img, -W * cfg.amp * 0.5, 0, W, H);
  c.globalAlpha = cfg.tint * 0.8;
  c.drawImage(img,  W * cfg.amp * 0.5, 0, W, H);
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = 1;
  for (let i = 0; i < cfg.n; i++){
    const y = rnd() * H, h = (0.01 + rnd() * 0.05) * H;
    const dx = (rnd() * 2 - 1) * cfg.amp * W;
    c.drawImage(img, 0, y, W, h, dx, y, W, h);
  }
  c.restore();
}

/* ═══ 전환 효과 ═══
   앞 클립의 마지막 화면과 새 클립의 첫 화면을 각각 한 장으로 만든 뒤 섞는다.
   전환은 '새 클립의 앞부분'에서 일어나므로 전체 길이가 변하지 않는다. */
function transitionAt(t){
  const loc = locate(t);
  if (!loc || loc.index === 0) return null;
  const tr = loc.clip.trans;
  if (!tr || tr.type === 'none' || tr.dur <= 0) return null;
  const d = Math.min(tr.dur, loc.dur, clipDur(project.clips[loc.index - 1]));
  if (d <= 0.01 || loc.local >= d) return null;
  return { loc, type:tr.type, p:clamp(loc.local / d, 0, 1) };
}
function blendTransition(c, A, B, type, p, W, H){
  c.save(); c.setTransform(1,0,0,1,0,0); c.filter = 'none'; c.globalCompositeOperation = 'source-over';
  const half = p < 0.5;
  switch (type){
    case 'black': case 'white':
      c.drawImage(half ? A : B, 0, 0, W, H);
      c.globalAlpha = half ? p * 2 : (1 - p) * 2;
      c.fillStyle = type === 'black' ? '#000' : '#fff';
      c.fillRect(0, 0, W, H);
      break;
    case 'slideL': c.drawImage(A, -p * W, 0, W, H); c.drawImage(B, (1 - p) * W, 0, W, H); break;
    case 'slideR': c.drawImage(A,  p * W, 0, W, H); c.drawImage(B, -(1 - p) * W, 0, W, H); break;
    case 'slideU': c.drawImage(A, 0, -p * H, W, H); c.drawImage(B, 0, (1 - p) * H, W, H); break;
    case 'slideD': c.drawImage(A, 0,  p * H, W, H); c.drawImage(B, 0, -(1 - p) * H, W, H); break;
    case 'wipeL':
      c.drawImage(A, 0, 0, W, H);
      c.save(); c.beginPath(); c.rect(0, 0, p * W, H); c.clip(); c.drawImage(B, 0, 0, W, H); c.restore();
      break;
    case 'circle':
      c.drawImage(A, 0, 0, W, H);
      c.save(); c.beginPath();
      c.arc(W/2, H/2, p * Math.hypot(W, H) / 2, 0, Math.PI * 2); c.clip();
      c.drawImage(B, 0, 0, W, H); c.restore();
      break;
    case 'zoom': {
      c.drawImage(B, 0, 0, W, H);
      const z = 1 + p * 0.7;
      c.globalAlpha = 1 - p;
      c.drawImage(A, W/2 - W*z/2, H/2 - H*z/2, W*z, H*z);
      break;
    }
    default:  // dissolve
      c.drawImage(B, 0, 0, W, H);
      c.globalAlpha = 1 - p;
      c.drawImage(A, 0, 0, W, H);
  }
  c.restore();
}

/* ═══ 렌더 파이프라인 — 프리뷰와 내보내기가 공유하는 유일한 그리기 경로 ═══ */
function renderFrame(c, t){
  const W = c.canvas.width, H = c.canvas.height;
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.filter = 'none'; c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  c.restore();

  const loc = locate(t);
  if (loc){
    const tr = transitionAt(t);
    if (tr){
      const prev = project.clips[loc.index - 1];
      const pd = clipDur(prev);
      const A = off('trA', W, H), B = off('trB', W, H);
      compositeClip(A.x, prev, pd, pd, W, H, Math.max(0, loc.start - 0.001));
      compositeClip(B.x, loc.clip, loc.local, loc.dur, W, H, t);
      blendTransition(c, A.c, B.c, tr.type, tr.p, W, H);
    } else {
      compositeClip(c, loc.clip, loc.local, loc.dur, W, H, t);
    }
  }
  drawOverlays(c, t, W, H);
  drawSubtitles(c, t, W, H);
}

/* ═══ 스티커(이미지 오버레이) ═══ */
const hitRects = [];   // 마지막 프레임의 화면 요소 사각형(0~1 정규화) — 마우스 히트테스트용
function drawOverlays(c, t, W, H){
  for (const o of project.overlays){
    if (t < o.start || t >= o.end) continue;
    const src = project.sources[o.srcId];
    if (!src || !src.el) continue;
    const iw = src.w || src.el.naturalWidth || 1, ih = src.h || src.el.naturalHeight || 1;
    const w = o.scale * W, h = w * ih / iw;
    const cx = o.x * W, cy = o.y * H;
    c.save();
    c.globalAlpha = clamp(o.opacity / 100, 0, 1);
    c.translate(cx, cy);
    c.rotate(o.rot * Math.PI / 180);
    try { c.drawImage(src.el, -w/2, -h/2, w, h); } catch(e){}
    c.restore();
    hitRects.push({ kind:'overlay', id:o.id, x:(cx - w/2)/W, y:(cy - h/2)/H, w:w/W, h:h/H });
  }
}

/* ═══ 자막 ═══
   (1) 레이아웃 → (2) 배치 → (3) 그리기 세 단계. 배치를 따로 빼 둔 덕에
   "마우스로 옮긴 자막(x,y 지정)" 과 "상/중/하 자동 배치(겹치면 쌓기)" 를 같은 코드로 처리한다. */
let subGuide = null;   // 드래그 중 중앙 스냅 가이드 { x, y }

const fontStr = (st, px) => `${st.italic ? 'italic ' : ''}${st.bold ? '700' : '400'} ${px}px ${(FONTS[st.font] || FONTS.gothic).stack}`;
const setSpacing = (c, px) => { if ('letterSpacing' in c) c.letterSpacing = px + 'px'; };
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeOutBack  = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x-1, 3) + c1 * Math.pow(x-1, 2); };
function easeOutBounce(x){
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1/d1) return n1 * x * x;
  if (x < 2/d1) return n1 * (x -= 1.5/d1) * x + 0.75;
  if (x < 2.5/d1) return n1 * (x -= 2.25/d1) * x + 0.9375;
  return n1 * (x -= 2.625/d1) * x + 0.984375;
}

function layoutSub(c, s, W, H){
  const st = s.style, scale = unit(W, H), fs = st.size * scale;
  c.font = fontStr(st, fs);
  setSpacing(c, st.spacing * scale);
  const lines = wrapLines(c, s.text, W * 0.9);
  let maxW = 0;
  for (const ln of lines) maxW = Math.max(maxW, c.measureText(ln).width);
  const pad = fs * 0.28, lh = fs * 1.24;
  return { s, st, lines, fs, lh, pad, scale, w:maxW + pad*2, h:lines.length*lh + pad*1.4, bx:0, by:0 };
}
function placeBlocks(blocks, W, H){
  const groups = { top:[], middle:[], bottom:[] };
  for (const b of blocks){
    const st = b.st;
    if (st.x == null || st.y == null) groups[st.pos in groups ? st.pos : 'bottom'].push(b);
    else { b.bx = st.x * W - b.w/2; b.by = st.y * H - b.h/2; }
  }
  const margin = H * 0.04, gap = H * 0.008;
  for (const pos in groups){
    const list = groups[pos];
    if (!list.length) continue;
    const total = list.reduce((a, b) => a + b.h + gap, -gap);
    let y = pos === 'top' ? margin : pos === 'middle' ? (H - total) / 2 : H - margin - total;
    for (const b of list){
      b.by = y;
      b.bx = b.st.align === 'left' ? W * 0.05 : b.st.align === 'right' ? W * 0.95 - b.w : (W - b.w) / 2;
      y += b.h + gap;
    }
  }
}
function subAnim(kind, local, dur, chars){
  const r = { alpha:1, scale:1, dy:0, reveal:1, wave:0 };
  const inT = Math.max(Math.min(0.4, dur * 0.4), 0.04);
  const pin = clamp(local / inT, 0, 1);
  if (kind === 'fade') r.alpha = Math.min(pin, clamp((dur - local) / inT, 0, 1));
  else if (kind === 'pop'){ r.alpha = Math.min(1, pin * 2); r.scale = 0.55 + 0.45 * easeOutBack(pin); }
  else if (kind === 'slideUp'){ const e = easeOutCubic(pin); r.alpha = e; r.dy = (1 - e) * 0.8; }
  else if (kind === 'bounce'){ r.alpha = Math.min(1, pin * 2); r.dy = -(1 - easeOutBounce(pin)) * 1.6; }
  else if (kind === 'wave'){ r.wave = local; }
  else if (kind === 'typewriter'){
    const span = Math.min(dur * 0.7, Math.max(0.4, chars * 0.07));
    r.reveal = clamp(local / span, 0, 1);
  }
  return r;
}
function drawText(c, txt, x, y, st, scale, lh){
  let fill = st.color;
  if (st.gradient){
    const g = c.createLinearGradient(0, y, 0, y + lh);
    g.addColorStop(0, st.color); g.addColorStop(1, st.color2);
    fill = g;
  }
  const outline = () => {
    if (st.strokeWidth > 0){
      c.lineJoin = 'round'; c.miterLimit = 2;
      c.lineWidth = st.strokeWidth * scale * 2;
      c.strokeStyle = st.stroke;
      c.strokeText(txt, x, y);
    }
  };
  const clearShadow = () => { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0; };
  if (st.shadow){
    c.shadowColor = st.shadowColor; c.shadowBlur = st.shadowBlur * scale;
    c.shadowOffsetX = st.shadowX * scale; c.shadowOffsetY = st.shadowY * scale;
    outline(); c.fillStyle = fill; c.fillText(txt, x, y);
    clearShadow();
  }
  if (st.glow){
    // 글로우는 한 번만 그리면 약해서 두 번 겹친다.
    c.shadowColor = st.glowColor; c.shadowBlur = st.glowBlur * scale;
    c.fillStyle = fill; c.fillText(txt, x, y); c.fillText(txt, x, y);
    clearShadow();
  }
  outline(); c.fillStyle = fill; c.fillText(txt, x, y);
}
function drawBlock(c, b, t){
  const { s, st, lines, fs, lh, pad, scale } = b;
  const chars = lines.reduce((a, ln) => a + [...ln].length, 0);
  const an = subAnim(st.anim, t - s.start, s.end - s.start, chars);
  if (an.alpha <= 0.001) return;
  c.save();
  c.font = fontStr(st, fs);
  setSpacing(c, st.spacing * scale);
  c.textBaseline = 'top'; c.textAlign = 'left';
  c.globalAlpha = an.alpha;
  const cx = b.bx + b.w/2, cy = b.by + b.h/2;
  c.translate(cx, cy + an.dy * fs);
  c.scale(an.scale, an.scale);
  c.translate(-cx, -cy);

  if (st.bg){
    c.fillStyle = hexA(st.bgColor, (st.bgOpacity / 100).toFixed(3));
    roundRect(c, b.bx, b.by, b.w, b.h, fs * 0.16);
    c.fill();
  }
  // 정렬은 항상 left 로 그리고 x 를 직접 계산한다 — 타자기 애니메이션에서 글자가
  // 하나씩 늘어날 때 가운데 정렬 텍스트가 좌우로 출렁이지 않게 하려고.
  let left = Math.floor(chars * an.reveal + 1e-6);
  lines.forEach((ln, i) => {
    const glyphs = [...ln];
    const shown = glyphs.slice(0, Math.max(0, left)).join('');
    left -= glyphs.length;
    if (!shown) return;
    const full = c.measureText(ln).width;
    const x = st.align === 'left' ? b.bx + pad
            : st.align === 'right' ? b.bx + b.w - pad - full
            : b.bx + (b.w - full) / 2;
    const y = b.by + pad * 0.7 + i * lh;
    if (st.anim === 'wave'){
      let gx = x;
      [...shown].forEach((ch, k) => {
        const dy = Math.sin(an.wave * 5 + k * 0.55) * fs * 0.11;
        drawText(c, ch, gx, y + dy, st, scale, lh);
        gx += c.measureText(ch).width;
      });
    } else {
      drawText(c, shown, x, y, st, scale, lh);
    }
  });
  c.restore();
}
function drawSubtitles(c, t, W, H){
  const active = project.subtitles.filter(s => t >= s.start && t < s.end && s.text.trim());
  if (!active.length) return;
  c.save();
  const blocks = active.map(s => layoutSub(c, s, W, H));
  placeBlocks(blocks, W, H);
  for (const b of blocks){
    drawBlock(c, b, t);
    hitRects.push({ kind:'subtitle', id:b.s.id, x:b.bx/W, y:b.by/H, w:b.w/W, h:b.h/H });
  }
  c.restore();
}
function wrapLines(c, text, maxW){
  const out = [];
  for (const para of String(text).split('\n')){
    if (!para){ out.push(''); continue; }
    let line = '';
    for (const ch of para){
      const test = line + ch;
      if (c.measureText(test).width > maxW && line){ out.push(line); line = ch; }
      else line = test;
    }
    out.push(line);
  }
  return out;
}
function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ═══ 프리뷰 전용 오버레이 — 선택 표시선·가이드. 내보내기에는 절대 들어가지 않는다 ═══ */
function drawEditorOverlay(c){
  const W = c.canvas.width, H = c.canvas.height, u = Math.max(1, Math.min(W,H) / 720);
  c.save();
  c.setTransform(1,0,0,1,0,0);
  c.globalAlpha = 1; c.filter = 'none'; c.globalCompositeOperation = 'source-over';

  if (project.guides){
    c.lineWidth = 1 * u; c.strokeStyle = 'rgba(255,255,255,.22)';
    c.beginPath();
    for (let i = 1; i < 3; i++){
      c.moveTo(W * i/3, 0); c.lineTo(W * i/3, H);
      c.moveTo(0, H * i/3); c.lineTo(W, H * i/3);
    }
    c.stroke();
    c.setLineDash([8*u, 6*u]); c.strokeStyle = 'rgba(255,214,102,.5)';
    c.strokeRect(W * 0.05, H * 0.05, W * 0.9, H * 0.9);
    c.setLineDash([]);
  }

  const r = hitRects.find(q => q.kind === selection.type && q.id === selection.id);
  if (r){
    c.lineWidth = 2 * u;
    if (subGuide && (subGuide.x || subGuide.y)){
      c.strokeStyle = 'rgba(255,94,94,.95)'; c.setLineDash([6*u, 5*u]);
      c.beginPath();
      if (subGuide.x){ c.moveTo(W/2, 0); c.lineTo(W/2, H); }
      if (subGuide.y){ c.moveTo(0, H/2); c.lineTo(W, H/2); }
      c.stroke();
    }
    c.setLineDash([7*u, 4*u]); c.strokeStyle = '#5b8cff';
    c.strokeRect(r.x*W, r.y*H, r.w*W, r.h*H);
    c.setLineDash([]); c.fillStyle = '#5b8cff';
    for (const [hx, hy] of [[r.x,r.y],[r.x+r.w,r.y],[r.x,r.y+r.h],[r.x+r.w,r.y+r.h]]){
      c.fillRect(hx*W - 3*u, hy*H - 3*u, 6*u, 6*u);
    }
  }
  c.restore();
}

/* ═══ 재생 루프 ═══
   재생헤드를 벽시계(rAF 의 dt)로 굴리면 디코드 지연·탭 스로틀링 때문에 반드시 video 와
   어긋나고, 그걸 매 프레임 시킹으로 메우다 보면 화면이 검게 깜빡인다.
   그래서 재생 중에는 video 의 currentTime 을 기준 시계로 삼고 재생헤드를 거기에 맞춘다.
   이러면 재생 중 시킹이 아예 필요 없다. 배경음악은 반대로 재생헤드를 따라간다. */
let stallSince = 0;
function tick(){
  if (playing) advanceByMedia();
  syncVideo();
  syncAudio();
  hitRects.length = 0;
  if (canvasDrag) syncLiveValues();
  renderFrame(ctx, playhead);
  if (!exporting) drawEditorOverlay(ctx);
  updateTransport();
  if (exporting) updateExportProgress();
  requestAnimationFrame(tick);
}
function advanceByMedia(){
  const loc = locate(playhead);
  if (!loc){ setPlaying(false); return; }
  const v = project.sources[loc.clip.srcId].el;

  if (v !== activeVideo || v.seeking || v.readyState < 2 || v.paused){
    // 아직 준비되지 않았다 — 시간을 멈춰 두고 기다린다.
    if (exporting){
      if (!stallSince) stallSince = performance.now();
      else if (performance.now() - stallSince > 15000){
        toast('영상이 응답하지 않아 내보내기를 중단했습니다', true);
        abortExport();
      }
    }
    return;
  }
  stallSince = 0;

  if (v.ended || v.currentTime >= loc.clip.outPoint - 0.002){
    if (loc.index >= project.clips.length - 1){
      playhead = totalDur();
      setPlaying(false);
      if (exporting) finishExport();
    } else {
      playhead = loc.start + loc.dur + 0.002;   // 다음 클립 맨 앞으로
      needSeek = true;
    }
    return;
  }
  const local = (v.currentTime - loc.clip.inPoint) / loc.clip.speed;
  playhead = clamp(loc.start + local, loc.start, loc.start + loc.dur);
}
function syncVideo(){
  const loc = locate(playhead);
  if (!loc){
    for (const id in project.sources){
      const s = project.sources[id];
      if (s.kind === 'video' && s.el && !s.el.paused) s.el.pause();
    }
    activeVideo = null;
    return;
  }
  const src = project.sources[loc.clip.srcId];
  const v = src.el;
  const switched = activeVideo !== v;
  if (switched && activeVideo) activeVideo.pause();
  activeVideo = v;

  for (const id in project.sources){
    const s = project.sources[id];
    if (s.kind === 'video' && s.el !== v && s.el && !s.el.paused) s.el.pause();
  }
  v.playbackRate = clamp(loc.clip.speed, 0.0625, 16);
  // 클립별 볼륨은 소스마다 달린 gain 에서 처리한다(Web Audio 가 없을 땐 element.volume).
  setGain(src, loc.clip.muted ? 0 : clamp(loc.clip.volume / 100, 0, 1));

  // 시킹은 사용자가 위치를 옮겼거나 클립이 바뀐 순간에만. 재생 중 드리프트 보정은 하지 않는다.
  const want = clamp(loc.sourceTime, 0, src.duration - 0.001);
  if (needSeek || switched){
    if (Math.abs(v.currentTime - want) > 0.04){ try { v.currentTime = want; } catch(e){} }
    needSeek = false;
  } else if (v.currentTime < loc.clip.inPoint - 0.35 || v.currentTime > loc.clip.outPoint + 0.35){
    try { v.currentTime = want; } catch(e){}   // 트림·속도 변경으로 구간 밖으로 밀려난 경우의 안전망
  }
  if (playing && v.paused) v.play().catch(() => {});
  if (!playing && !v.paused) v.pause();

  // 다음 클립 미리 디코드 — 클립 경계와 전환 효과에서 검은 프레임이 끼는 걸 막는다.
  const next = project.clips[loc.index + 1];
  if (next && loc.dur - loc.local < 1.2){
    const nsrc = project.sources[next.srcId];
    if (nsrc && nsrc.el !== v){
      const nv = nsrc.el;
      if (Math.abs(nv.currentTime - next.inPoint) > 0.3){
        try { nv.currentTime = clamp(next.inPoint, 0, nsrc.duration - 0.001); } catch(e){}
      }
    }
  }
}
// 배경음악은 영상과 달리 재생헤드를 따라간다. 드리프트가 커질 때만 살짝 맞춘다.
function syncAudio(){
  // 같은 파일을 여러 구간에 깔 수 있으므로, 소스마다 '울려야 하는 최대 볼륨' 을 모은 뒤 한 번에 건다.
  const mix = new Map();
  for (const a of project.audio){
    const src = project.sources[a.srcId];
    if (!src || !src.el) continue;
    const el = src.el;
    const inside = playhead >= a.start && playhead < a.end;
    if (!inside){
      if (!mix.has(src.id)) mix.set(src.id, { src, g:0, play:false });
      continue;
    }
    const local = playhead - a.start;
    const want = clamp(a.inPoint + local, 0, Math.max(src.duration - 0.05, 0));
    if (needSeek || Math.abs(el.currentTime - want) > 0.3){
      try { el.currentTime = want; } catch(e){}
    }
    let g = clamp(a.volume / 100, 0, 1);
    const len = a.end - a.start;
    if (a.fadeIn > 0)  g *= clamp(local / a.fadeIn, 0, 1);
    if (a.fadeOut > 0) g *= clamp((len - local) / a.fadeOut, 0, 1);
    const cur = mix.get(src.id);
    if (!cur || g > cur.g) mix.set(src.id, { src, g, play:true });
    else cur.play = true;
  }
  for (const { src, g, play } of mix.values()){
    setGain(src, g);
    if (play && playing && src.el.paused) src.el.play().catch(() => {});
    if ((!play || !playing) && !src.el.paused) src.el.pause();
  }
}
function setPlaying(p){
  playing = p;
  if (p && audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  $('#btn-play').textContent = p ? '❚❚' : '▶';
  if (!p){
    if (activeVideo) activeVideo.pause();
    for (const a of project.audio){
      const s = project.sources[a.srcId];
      if (s && s.el && !s.el.paused) s.el.pause();
    }
  }
}
function togglePlay(){
  if (!project.clips.length || exporting) return;
  if (!playing && playhead >= totalDur() - 0.02){ playhead = 0; needSeek = true; }
  setPlaying(!playing);
}
function seekTo(t){
  playhead = clamp(t, 0, totalDur());
  needSeek = true;
  updateTransport();
}
function updateTransport(){
  $('#time').innerHTML = `<b>${fmt(playhead)}</b> / ${fmt(totalDur())}`;
  phEl.style.transform = `translateX(${playhead * pxPerSec}px)`;
}

/* ═══ 타임라인 ═══ */
function fitZoom(){
  const total = totalDur();
  if (total <= 0) return;
  // 창이 아직 레이아웃되기 전이면 폭이 0 으로 잡힌다. 그대로 계산하면 확대율이
  // 최솟값으로 뭉개져 타임라인을 못 쓰게 되므로 측정이 될 때까지 건너뛴다.
  const w = tlScroll.clientWidth - 24;
  if (w <= 0) return;
  pxPerSec = clamp(w / total, 4, 240);
  $('#zoom').value = String(Math.round(pxPerSec));
}
function drawRuler(){
  const total = Math.max(totalDur(), 1);
  const w = Math.max(total * pxPerSec + 40, tlScroll.clientWidth);
  const dpr = window.devicePixelRatio || 1;
  ruler.width = Math.floor(w * dpr); ruler.height = Math.floor(22 * dpr);
  ruler.style.width = w + 'px'; ruler.style.height = '22px';
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  rctx.clearRect(0, 0, w, 22);
  rctx.fillStyle = '#12151b'; rctx.fillRect(0, 0, w, 22);

  const steps = [0.1,0.25,0.5,1,2,5,10,15,30,60,120,300,600];
  const step = steps.find(s => s * pxPerSec >= 62) || 900;
  rctx.strokeStyle = '#2d323d'; rctx.fillStyle = '#6a7285';
  rctx.font = '10px system-ui, sans-serif'; rctx.textBaseline = 'top';
  rctx.beginPath();
  for (let t = 0; t <= total + step; t += step){
    const x = Math.round(t * pxPerSec) + 0.5;
    rctx.moveTo(x, 12); rctx.lineTo(x, 22);
    rctx.fillText(fmt(t).slice(0, 5), x + 3, 2);
  }
  const half = step / 2;
  for (let t = half; t <= total + step; t += step){
    const x = Math.round(t * pxPerSec) + 0.5;
    rctx.moveTo(x, 17); rctx.lineTo(x, 22);
  }
  rctx.stroke();
  tlInner.style.width = w + 'px';
}

const clipEls = new Map();
const transEls = new Map();
const barEls = { effect:new Map(), overlay:new Map(), subtitle:new Map(), audio:new Map() };
const LANE = { clipTop:24, clipH:50, row:24, gap:16 };

// 겹치는 구간은 다른 줄로 내려 보낸다 — 한 줄에 겹쳐 그리면 아래 막대를 못 집는다.
function packRows(items){
  const order = items.slice().sort((a,b) => a.start - b.start || a.end - b.end);
  const ends = [], rowOf = new Map();
  for (const it of order){
    let r = ends.findIndex(e => e <= it.start + 1e-6);
    if (r < 0){ r = ends.length; ends.push(0); }
    ends[r] = it.end;
    rowOf.set(it.id, r);
  }
  return { rowOf, rows:Math.max(1, ends.length) };
}
function syncBars(lane, cache, items, cls, rowOf, selType, label){
  const seen = new Set();
  for (const it of items){
    let el = cache.get(it.id);
    if (!el){
      el = document.createElement('div');
      el.className = 'bar ' + cls; el.dataset.id = it.id;
      el.innerHTML = '<span></span><div class="h l" data-edge="l"></div><div class="h r" data-edge="r"></div>';
      lane.appendChild(el); cache.set(it.id, el);
    }
    el.style.left  = (it.start * pxPerSec) + 'px';
    el.style.width = Math.max((it.end - it.start) * pxPerSec, 8) + 'px';
    el.style.top   = (rowOf.get(it.id) * LANE.row + 2) + 'px';
    el.classList.toggle('sel', selection.type === selType && selection.id === it.id);
    el.firstChild.textContent = label(it);
    seen.add(it.id);
  }
  for (const [id, el] of cache) if (!seen.has(id)){ el.remove(); cache.delete(id); }
}
const srcName = id => (project.sources[id] && project.sources[id].name) || '파일 없음';

function renderTimeline(){
  drawRuler();
  // 클립 — DOM 노드를 id 로 재사용해 긴 타임라인에서도 재생성 비용이 들지 않게 한다.
  const seen = new Set(), seenT = new Set();
  let acc = 0;
  project.clips.forEach((c, i) => {
    const d = clipDur(c);
    let el = clipEls.get(c.id);
    if (!el){
      el = document.createElement('div');
      el.className = 'clip'; el.dataset.id = c.id;
      el.innerHTML = '<div class="veil"></div><div class="meta"></div><div class="mute"></div><div class="name"></div>' +
                     '<div class="h l" data-edge="l"></div><div class="h r" data-edge="r"></div>';
      laneClips.appendChild(el); clipEls.set(c.id, el);
    }
    const src = project.sources[c.srcId];
    el.style.left  = (acc * pxPerSec) + 'px';
    el.style.width = Math.max(d * pxPerSec, 8) + 'px';
    el.classList.toggle('sel', selection.type === 'clip' && selection.id === c.id);
    if (src && src.thumb && el.dataset.thumb !== src.id){
      el.style.backgroundImage = `url(${src.thumb})`;
      el.dataset.thumb = src.id;
    }
    el.querySelector('.name').textContent = srcName(c.srcId);
    el.querySelector('.meta').textContent = fmt(d).slice(0,5) + (c.speed !== 1 ? ` · ${c.speed}x` : '');
    el.querySelector('.mute').textContent = c.muted ? '🔇' : (c.volume !== 100 ? c.volume + '%' : '');
    seen.add(c.id);

    // 클립 사이 전환 배지
    if (i > 0){
      let t = transEls.get(c.id);
      if (!t){
        t = document.createElement('div');
        t.className = 'trans'; t.dataset.id = c.id;
        t.title = '전환 효과';
        laneClips.appendChild(t); transEls.set(c.id, t);
      }
      t.style.left = (acc * pxPerSec) + 'px';
      t.textContent = TRANS_ICON[c.trans.type] || '—';
      t.classList.toggle('on', c.trans.type !== 'none');
      seenT.add(c.id);
    }
    acc += d;
  });
  for (const [id, el] of clipEls)  if (!seen.has(id)){ el.remove(); clipEls.delete(id); }
  for (const [id, el] of transEls) if (!seenT.has(id)){ el.remove(); transEls.delete(id); }

  // 구간 레인 4개를 위에서부터 필요한 높이만큼 쌓는다.
  const lanes = [
    { el:laneFx,   cache:barEls.effect,   items:project.effects,   cls:'fx',  type:'effect',
      label:e => EFFECT_LABEL[e.type] + (e.type === 'filter' ? ` · ${FILTER_LABEL[e.preset] || ''}` : '') },
    { el:laneOvl,  cache:barEls.overlay,  items:project.overlays,  cls:'ovl', type:'overlay',  label:o => srcName(o.srcId) },
    { el:laneSubs, cache:barEls.subtitle, items:project.subtitles, cls:'sub', type:'subtitle', label:s => s.text.split('\n')[0] || '자막' },
    { el:laneAud,  cache:barEls.audio,    items:project.audio,     cls:'aud', type:'audio',    label:a => srcName(a.srcId) },
  ];
  let top = LANE.clipTop + LANE.clipH + 6;
  for (const L of lanes){
    const pack = packRows(L.items);
    const h = pack.rows * LANE.row;
    L.el.style.top = top + 'px';
    L.el.style.height = h + 'px';
    syncBars(L.el, L.cache, L.items, L.cls, pack.rowOf, L.type, L.label);
    top += h + 6;
  }
  tlInner.style.height = Math.max(top + 4, tlScroll.clientHeight) + 'px';
}

/* ═══ 자석(스냅) ═══ */
function snapPoints(excludeId){
  const pts = [0, playhead];
  let acc = 0;
  for (const c of project.clips){ pts.push(acc); acc += clipDur(c); }
  pts.push(acc);
  for (const k of ['subtitles','effects','overlays','audio'])
    for (const it of project[k]) if (it.id !== excludeId){ pts.push(it.start); pts.push(it.end); }
  return pts;
}
function snapOne(t, pts){
  if (!snapOn) return { t, hit:null };
  const tol = 8 / pxPerSec;
  let best = null, bd = tol;
  for (const p of pts){ const d = Math.abs(p - t); if (d < bd){ bd = d; best = p; } }
  return best == null ? { t, hit:null } : { t:best, hit:best };
}
function showSnap(hit){
  if (hit == null){ snapEl.style.display = 'none'; return; }
  snapEl.style.display = 'block';
  snapEl.style.left = (hit * pxPerSec) + 'px';
}

/* ═══ 타임라인 상호작용 ═══ */
const xToTime = clientX => {
  const r = tlInner.getBoundingClientRect();
  return clamp((clientX - r.left) / pxPerSec, 0, Math.max(totalDur(), 0.001));
};
ruler.addEventListener('pointerdown', e => {
  if (exporting) return;
  try { ruler.setPointerCapture(e.pointerId); } catch(_){}
  seekTo(xToTime(e.clientX));
  const move = ev => seekTo(xToTime(ev.clientX));
  const up = () => { ruler.removeEventListener('pointermove', move); ruler.removeEventListener('pointerup', up); };
  ruler.addEventListener('pointermove', move);
  ruler.addEventListener('pointerup', up);
});

laneClips.addEventListener('pointerdown', e => {
  if (exporting) return;
  const tb = e.target.closest('.trans');
  if (tb){ openTransitionMenu(tb.dataset.id); return; }
  const el = e.target.closest('.clip');
  if (!el) return;
  const c = findClip(el.dataset.id);
  if (!c) return;
  select('clip', c.id);
  const edge = e.target.dataset.edge;
  const startX = e.clientX;
  try { el.setPointerCapture(e.pointerId); } catch(_){}

  if (edge){
    const in0 = c.inPoint, out0 = c.outPoint, maxD = project.sources[c.srcId].duration;
    const move = ev => {
      const dSrc = (ev.clientX - startX) / pxPerSec * c.speed;  // 화면 픽셀 → 소스 시간
      if (edge === 'l') c.inPoint  = clamp(in0 + dSrc, 0, out0 - MIN_CLIP * c.speed);
      else              c.outPoint = clamp(out0 + dSrc, in0 + MIN_CLIP * c.speed, maxD);
      renderTimeline(); updateTransport(); renderInspector();
    };
    const up = () => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up);
      pushHistory(); refreshAll();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    return;
  }

  // 본체 드래그 → 순서 변경
  const from = project.clips.indexOf(c);
  const left0 = parseFloat(el.style.left);
  let target = from, moved = false;
  el.classList.add('dragging');
  const move = ev => {
    const dx = ev.clientX - startX;
    if (Math.abs(dx) > 3) moved = true;
    el.style.left = (left0 + dx) + 'px';
    const center = left0 + dx + el.offsetWidth / 2;
    let acc = 0; target = project.clips.length - 1;
    for (let i = 0; i < project.clips.length; i++){
      const w = clipDur(project.clips[i]) * pxPerSec;
      if (center < acc + w / 2){ target = i; break; }
      acc += w;
    }
  };
  const up = () => {
    el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up);
    el.classList.remove('dragging');
    if (moved && target !== from){
      project.clips.splice(from, 1);
      project.clips.splice(target, 0, c);
      pushHistory();
    }
    refreshAll();
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
});

// 자막·효과·스티커·음악 막대는 모두 [start, end] 구간이라 한 코드로 처리한다.
function bindRangeLane(lane, type, capToTotal){
  lane.addEventListener('pointerdown', e => {
    if (exporting) return;
    const el = e.target.closest('.bar');
    if (!el) return;
    const it = KINDS[type].find(el.dataset.id);
    if (!it) return;
    select(type, it.id);
    const edge = e.target.dataset.edge;
    const startX = e.clientX, st0 = it.start, en0 = it.end;
    let moved = false;
    try { el.setPointerCapture(e.pointerId); } catch(_){}
    const move = ev => {
      if (Math.abs(ev.clientX - startX) > 2) moved = true;
      if (!moved) return;
      const d = (ev.clientX - startX) / pxPerSec;
      const T = capToTotal ? Math.max(totalDur(), 0.1) : Infinity;
      const pts = snapPoints(it.id);
      let hit = null;
      if (edge === 'l'){
        const s = snapOne(clamp(st0 + d, 0, en0 - 0.1), pts); hit = s.hit;
        it.start = clamp(s.t, 0, en0 - 0.1);
      } else if (edge === 'r'){
        const s = snapOne(clamp(en0 + d, st0 + 0.1, Math.max(T, st0 + 0.1)), pts); hit = s.hit;
        it.end = clamp(s.t, st0 + 0.1, Math.max(T, st0 + 0.1));
      } else {
        const len = en0 - st0;
        const rawS = clamp(st0 + d, 0, Math.max(T - len, 0));
        const a = snapOne(rawS, pts), b = snapOne(rawS + len, pts);
        // 앞쪽·뒤쪽 중 더 가까이 붙는 쪽을 택한다.
        const da = a.hit == null ? Infinity : Math.abs(a.t - rawS);
        const db = b.hit == null ? Infinity : Math.abs(b.t - len - rawS);
        let s = rawS;
        if (da <= db && a.hit != null){ s = a.t; hit = a.hit; }
        else if (b.hit != null){ s = b.t - len; hit = b.hit; }
        it.start = clamp(s, 0, Math.max(T - len, 0));
        it.end = it.start + len;
      }
      showSnap(hit);
      const sEl = inspector.querySelector('#rg-start'), eEl = inspector.querySelector('#rg-end');
      if (sEl) sEl.value = it.start.toFixed(2);
      if (eEl) eEl.value = it.end.toFixed(2);
      renderTimeline();
    };
    const up = () => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up);
      showSnap(null);
      if (moved){ sortRanges(); pushHistory(); }   // 클릭만 한 건 되돌릴 이력을 만들지 않는다
      // 화면에서 마우스로 끌려면 재생헤드가 구간 안에 있어야 하므로 자동으로 데려간다.
      if ((type === 'subtitle' || type === 'overlay') && !(playhead >= it.start && playhead < it.end)){
        seekTo(it.start + 0.01);
      }
      refreshAll();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
}
bindRangeLane(laneFx,   'effect',   true);
bindRangeLane(laneOvl,  'overlay',  true);
bindRangeLane(laneSubs, 'subtitle', false);
bindRangeLane(laneAud,  'audio',    false);

tlScroll.addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const t = xToTime(e.clientX);
  pxPerSec = clamp(pxPerSec * (e.deltaY < 0 ? 1.15 : 0.87), 4, 240);
  zoomTouched = true;
  $('#zoom').value = String(Math.round(pxPerSec));
  renderTimeline(); updateTransport();
  tlScroll.scrollLeft = t * pxPerSec - (e.clientX - tlScroll.getBoundingClientRect().left);
}, { passive:false });

// 세로 스크롤이 생겨도 눈금자는 위에 고정한다.
tlScroll.addEventListener('scroll', () => { ruler.style.transform = `translateY(${tlScroll.scrollTop}px)`; });

function scrollPlayheadIntoView(){
  const x = playhead * pxPerSec;
  if (x < tlScroll.scrollLeft || x > tlScroll.scrollLeft + tlScroll.clientWidth - 30){
    tlScroll.scrollLeft = x - tlScroll.clientWidth / 2;
  }
}

/* ═══ 선택 & 편집 동작 ═══ */
function select(type, id){
  selection = { type, id };
  if (type) curTab = 'sel';
  syncTabs();
  renderTimeline();
  renderInspector(true);
}
function splitAtPlayhead(){
  const loc = locate(playhead);
  if (!loc) return;
  if (loc.local < MIN_CLIP || loc.dur - loc.local < MIN_CLIP){
    toast('분할하기엔 위치가 클립 끝에 너무 가깝습니다', true);
    return;
  }
  const c = loc.clip;
  const cut = c.inPoint + loc.local * c.speed;   // 소스 기준 절단점
  const right = { ...clone(c), id:uid('clip'), inPoint:cut, trans:{ type:'none', dur:0.5 } };
  c.outPoint = cut;
  project.clips.splice(loc.index + 1, 0, right);
  pushHistory();
  select('clip', right.id);
  refreshAll();
}
function deleteSelected(){
  const k = KINDS[selection.type];
  if (!k) return;
  const list = k.list();
  const i = list.findIndex(o => o.id === selection.id);
  if (i < 0) return;
  list.splice(i, 1);   // 클립은 시작시간을 누적으로 계산하므로 뒤 클립이 자동으로 앞당겨진다
  pushHistory();
  selection = { type:null, id:null };
  playhead = clamp(playhead, 0, totalDur());
  refreshAll();
}
function duplicateSelected(){
  const k = KINDS[selection.type];
  if (!k || exporting) return;
  const list = k.list();
  const i = list.findIndex(o => o.id === selection.id);
  if (i < 0) return;
  const copy = clone(list[i]);
  copy.id = uid(selection.type.slice(0,3));
  if (selection.type === 'clip'){
    list.splice(i + 1, 0, copy);
  } else {
    const len = copy.end - copy.start;
    copy.start = copy.end; copy.end = copy.start + len;   // 바로 뒤에 이어 붙인다
    list.push(copy);
    sortRanges();
  }
  pushHistory();
  select(selection.type, copy.id);
  refreshAll();
  toast('복제했습니다');
}
function addRange(type, extra, len){
  if (!project.clips.length || exporting){ toast('먼저 영상을 불러오세요', true); return null; }
  const total = totalDur();
  let start = clamp(playhead, 0, Math.max(total - 0.2, 0));
  let end = Math.min(start + len, total);
  if (end - start < 0.4){ end = total; start = Math.max(0, total - len); }
  const it = { id:uid(type.slice(0,3)), start, end, ...extra };
  KINDS[type].list().push(it);
  sortRanges();
  pushHistory();
  select(type, it.id);
  refreshAll();
  return it;
}
function addEffect(type){
  const def = EFFECTS.find(e => e.type === type);
  if (def) addRange('effect', { type, ...clone(def.def) }, 2);
}
function addFilter(preset, whole){
  if (!project.clips.length){ toast('먼저 영상을 불러오세요', true); return; }
  if (whole){
    const it = { id:uid('eff'), type:'filter', preset, start:0, end:totalDur() };
    project.effects.push(it);
    sortRanges(); pushHistory(); select('effect', it.id); refreshAll();
    toast(`${FILTER_LABEL[preset]} 필터를 영상 전체에 적용했습니다`);
  } else {
    addRange('effect', { type:'filter', preset }, 3);
  }
}
function addSubtitle(text){
  const s = addRange('subtitle', { text:text || '자막을 입력하세요', style:clone(SUB_STYLE_DEF) }, 2);
  if (!s) return;
  const ta = $i('sub-text');
  if (ta){ ta.focus(); ta.select(); }
}
function openTransitionMenu(clipId){
  const c = findClip(clipId);
  if (!c) return;
  select('clip', c.id);
  const maxD = Math.min(clipDur(c), clipDur(project.clips[project.clips.indexOf(c) - 1] || c));
  modal.innerHTML = `<h2>전환 효과</h2>
    <div class="chips" id="tr-list">${TRANSITIONS.map(t =>
      `<div class="chip ${c.trans.type === t.id ? 'on' : ''}" data-tr="${t.id}">${t.icon} ${t.label}</div>`).join('')}</div>
    <div style="margin-top:14px">${sliderRowRaw('tr-dur','길이',0.1,Math.max(0.2,Math.min(2,maxD)),0.05,clamp(c.trans.dur,0.1,2),'초',0.5)}</div>
    <div class="hint">앞 클립의 마지막 화면과 이 클립의 첫 화면을 섞습니다. 전환은 이 클립의 앞부분에서
      일어나므로 전체 길이는 변하지 않습니다.</div>
    <div class="actions"><button id="tr-close" class="primary">닫기</button></div>`;
  scrim.classList.add('on');
  modal.querySelectorAll('[data-tr]').forEach(ch => {
    ch.onclick = () => {
      c.trans.type = ch.dataset.tr;
      modal.querySelectorAll('[data-tr]').forEach(o => o.classList.toggle('on', o === ch));
      pushHistory(); renderTimeline();
      if (c.trans.type !== 'none') seekTo(clipStartOf(project.clips.indexOf(c)) + c.trans.dur * 0.5);
    };
  });
  bindSliderIn(modal, 'tr-dur', '초', v => { c.trans.dur = v; renderTimeline(); });
  modal.querySelector('#tr-close').onclick = closeModal;
}

/* ═══ SRT ═══ */
function exportSRT(){
  const subs = project.subtitles.filter(s => s.text.trim()).slice().sort((a,b) => a.start - b.start);
  if (!subs.length){ toast('저장할 자막이 없습니다', true); return; }
  const body = subs.map((s, i) =>
    `${i + 1}\n${srtTime(s.start)} --> ${srtTime(s.end)}\n${s.text.trim()}\n`).join('\n');
  download(new Blob([body], { type:'text/plain;charset=utf-8' }), `minicut-${stamp()}.srt`);
  toast('SRT 파일을 저장했습니다');
}
const srtSec = str => {
  const m = /(\d+):(\d+):(\d+)[,.](\d+)/.exec(str);
  return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) + (+m[4]) / 1000 : null;
};
async function importSRT(file){
  let text = '';
  try { text = await file.text(); } catch(e){ toast('파일을 읽지 못했습니다', true); return; }
  const blocks = text.replace(/\r/g, '').split(/\n{2,}/);
  const style = clone(SUB_STYLE_DEF);
  let n = 0;
  for (const b of blocks){
    const lines = b.split('\n').filter(l => l.trim() !== '');
    const ti = lines.findIndex(l => l.includes('-->'));
    if (ti < 0) continue;
    const [a, z] = lines[ti].split('-->');
    const start = srtSec(a), end = srtSec(z);
    if (start == null || end == null || end <= start) continue;
    const body = lines.slice(ti + 1).join('\n').trim();
    if (!body) continue;
    project.subtitles.push({ id:uid('sub'), start, end, text:body, style:clone(style) });
    n++;
  }
  if (!n){ toast('읽을 수 있는 자막이 없습니다', true); return; }
  sortRanges(); pushHistory(); refreshAll();
  toast(`자막 ${n}개를 가져왔습니다`);
}
// 여러 문장이 든 자막을 문장 단위로 쪼개 시간까지 글자 수 비례로 나눈다.
function splitSubtitle(){
  const s = findSub(selection.id);
  if (!s) return;
  const parts = s.text.split(/(?<=[.!?。！？…])\s+|\n+/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 2){ toast('나눌 문장이 없습니다 (마침표나 줄바꿈 기준)', true); return; }
  const total = parts.reduce((a, p) => a + p.length, 0) || 1;
  const i = project.subtitles.indexOf(s);
  const span = s.end - s.start;
  let t = s.start;
  const made = parts.map(p => {
    const d = span * (p.length / total);
    const o = { id:uid('sub'), start:t, end:t + d, text:p, style:clone(s.style) };
    t += d; return o;
  });
  project.subtitles.splice(i, 1, ...made);
  sortRanges(); pushHistory(); select('subtitle', made[0].id); refreshAll();
  toast(`자막 ${made.length}개로 나눴습니다`);
}

/* ═══ 속성 패널 ═══ */
let panelKey = '', lastSel = '';
const secOpen = { preset:true, font:true, fx:false, pos:true, anim:false, tf:true, aud:false };
const $i = id => inspector.querySelector('#' + id);

function syncTabs(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === curTab));
}
function renderInspector(force){
  const key = [curTab, selection.type, selection.id, project.clips.length, project.effects.length,
               project.overlays.length, project.audio.length, project.subtitles.length].join(':');
  if (!force && key === panelKey){ syncLiveValues(); return; }
  panelKey = key;
  const selKey = curTab + ':' + selection.type + ':' + selection.id;
  const keepScroll = selKey === lastSel ? inspector.scrollTop : 0;
  lastSel = selKey;

  let html = '';
  if (curTab === 'sel')         html = selectionPanel();
  else if (curTab === 'fx')     html = fxTab();
  else if (curTab === 'filter') html = filterTab();
  else if (curTab === 'add')    html = addTab();
  else                          html = projectTab();

  inspector.innerHTML = html;
  inspector.scrollTop = keepScroll;
  bindInspector();
}

/* --- 공통 위젯 --- */
function sliderRowRaw(id, label, min, max, step, val, unit, def){
  return `<div class="row">
    <label>${label}<span class="v" data-out="${id}">${val}${unit || ''}</span></label>
    <div class="slider-row">
      <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-def="${def}">
      <input type="number" id="${id}-n" min="${min}" max="${max}" step="${step}" value="${val}">
    </div></div>`;
}
const sliderRow = sliderRowRaw;
const colorRow = (id, label, val) => `<div class="row"><label>${label}</label><input type="color" id="${id}" value="${val}"></div>`;
const checkRow = (id, label, on) => `<div class="row"><label class="check"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label></div>`;
const segHtml = (id, opts, cur) => `<div class="seg" id="${id}">${opts.map(([v, l]) =>
  `<button data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const rangeRow = it => `<div class="grid2">
  <div class="row"><label>시작<span class="v">${fmt(it.start)}</span></label>
    <input type="number" id="rg-start" step="0.1" min="0" value="${it.start.toFixed(2)}"></div>
  <div class="row"><label>종료<span class="v">${fmt(it.end)}</span></label>
    <input type="number" id="rg-end" step="0.1" min="0" value="${it.end.toFixed(2)}"></div></div>`;
const sec = (id, title, inner) =>
  `<details class="sec" data-sec="${id}" ${secOpen[id] ? 'open' : ''}><summary>${title}</summary><div class="sec-body">${inner}</div></details>`;

    return `<div class="block"><h3>선택 없음</h3><div class="empty-note">

function fxPanel(e){
  let p = '';
  const hints = {
    fadeIn:'구간 시작은 검은 화면, 끝에서 원래 화면으로 밝아집니다.',
    fadeOut:'구간 시작은 원래 화면, 끝에서 검은 화면이 됩니다.',
    grayscale:'이 구간 안에서만 흑백이 됩니다.',
    sepia:'이 구간 안에서만 세피아 톤이 됩니다.',
    invert:'색을 반대로 뒤집습니다.',
  };
  if (hints[e.type]) p += `<div class="hint" style="margin:0 0 10px">${hints[e.type]}</div>`;
  if (e.type === 'filter'){
    p += `<div class="row"><label>필터</label><select id="fx-preset">${
      FILTERS.map(f => `<option value="${f.id}" ${e.preset === f.id ? 'selected' : ''}>${f.label}</option>`).join('')}</select></div>`;
  }
  if (e.type === 'blur')      p += sliderRow('fx-blur','블러 반경',0,30,0.5,e.amount,'px',8);
  if (e.type === 'pixelate')  p += sliderRow('fx-pixelate','모자이크 크기',4,100,1,e.amount,'',26);
  if (e.type === 'flash'){
    p += colorRow('fx-flashc','색',e.color) + sliderRow('fx-times','깜빡임 횟수',1,10,1,e.times,'번',1);
  }
  if (e.type === 'kenburns'){
    p += `<div class="row"><label>줌 방향</label>${segHtml('kb-dir', [['in','줌 인'],['out','줌 아웃']], e.dir)}</div>`
       + sliderRow('fx-kbzoom','줌 배율',1,2,0.01,e.zoom,'x',1.3)
       + `<div class="hint" style="margin:0 0 10px">구간이 끝나면 원래 크기로 돌아갑니다.</div>`;
  }
  if (e.type === 'zoomPulse'){
    p += sliderRow('fx-zpamt','세기',1,60,1,e.amount,'%',12) + sliderRow('fx-zpspd','횟수',1,12,1,e.speed,'번',2);
  }
  if (e.type === 'spin') p += sliderRow('fx-turns','회전 바퀴',-4,4,0.25,e.turns,'바퀴',1);
  if (e.type === 'mirror') p += `<div class="row"><label>방향</label>${segHtml('mir-dir', [['h','좌우'],['v','상하']], e.dir)}</div>`;
  if (e.type === 'shake' || e.type === 'glitch'){
    const id = e.type === 'shake' ? 'shake-lv' : 'glitch-lv';
    p += `<div class="row"><label>세기</label>${segHtml(id, [['low','약'],['mid','중'],['high','강']], e.level)}</div>`;
  }
  return `<div class="block"><h3>효과 · ${EFFECT_LABEL[e.type]}</h3>
    ${rangeRow(e)}
    ${p}
    <div class="grid2"><button id="fx-fit">클립 전체에 맞추기</button><button id="fx-del">삭제</button></div>
    <button id="fx-all" style="width:100%;margin-top:8px">영상 전체에 적용</button>
  </div>`;
}
